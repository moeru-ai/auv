# This Worker serves the whole auv.moeru.ai site: docs-website at `/` and
# repl-playground under `/playground/` (merged by
# `pnpm -F @auv-js/docs-website build:site`).
name = "moeru-ai-auv"
compatibility_date = "2026-10-06"
preview_urls = true
# NOTICE(dashboard-managed-routes): Domain and route ownership intentionally
# lives in the Cloudflare dashboard rather than this deploy configuration.
workers_dev = false

# Assets-only Worker. `/playground` redirects to `/playground/` (its
# index.html); other unknown paths fall back to the docs-website index.html,
# which routes `/film`, `/render`, and `/export` in the browser.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
