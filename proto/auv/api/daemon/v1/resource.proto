// EXPERIMENTAL / UNSTABLE
// Resource references are separated from service descriptors so custom and
// process Runner reflection can publish an exact transitive schema closure.
syntax = "proto3";

package auv.api.daemon.v1;

message DeviceRef {
  string device_id = 1;
}

message RunRef {
  string run_id = 1;
}

message RunnerClassRef {
  string runner_class = 1;
}

message RunnerRef {
  string runner_id = 1;
}
