// EXPERIMENTAL / UNSTABLE
// auv.api.daemon.v1 is not a long-term public compatibility promise.
syntax = "proto3";

package auv.api.daemon.v1;

import "auv/api/daemon/v1/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service RunnerService {
  rpc CreateRunner(CreateRunnerRequest) returns (CreateRunnerResponse);
  rpc ListRunners(ListRunnersRequest) returns (ListRunnersResponse);
  rpc GetRunner(GetRunnerRequest) returns (GetRunnerResponse);
  rpc DeleteRunner(DeleteRunnerRequest) returns (DeleteRunnerResponse);
}

service RunnerClassService {
  rpc ListRunnerClasses(ListRunnerClassesRequest) returns (ListRunnerClassesResponse);
  rpc GetRunnerClass(GetRunnerClassRequest) returns (GetRunnerClassResponse);
}

message RunnerClass {
  RunnerClassRef ref = 1;
  DeviceRef device = 2;
  string display_name = 3;
  repeated RunnerLifecycle supported_lifecycles = 4;
  reserved 5;
  reserved "capabilities";
  bool available = 6;
}

enum RunnerLifecycle {
  RUNNER_LIFECYCLE_UNSPECIFIED = 0;
  RUNNER_LIFECYCLE_EPHEMERAL = 1;
  RUNNER_LIFECYCLE_UNLESS_IDLE = 2;
  RUNNER_LIFECYCLE_UNLESS_SHUTDOWN = 3;
}

enum RunnerPhase {
  RUNNER_PHASE_UNSPECIFIED = 0;
  RUNNER_PHASE_STARTING = 1;
  RUNNER_PHASE_READY = 2;
  RUNNER_PHASE_DRAINING = 3;
  RUNNER_PHASE_STOPPED = 4;
  RUNNER_PHASE_FAILED = 5;
}

message Runner {
  RunnerRef ref = 1;
  DeviceRef device = 2;
  RunnerClassRef runner_class = 3;
  map<string, string> labels = 4;
  RunnerLifecycle lifecycle = 5;
  google.protobuf.Duration idle_timeout = 6;
  RunnerPhase phase = 7;
  google.protobuf.Timestamp created_at = 8;
  reserved 9;
  reserved "capabilities";
  reserved 10;
  reserved "descriptor_set_sha256";
  // OS process identifier for daemon-owned process Runners. This is
  // diagnostic evidence, not a stable resource identity.
  uint32 process_id = 11;
  reserved 12;
  reserved "operation_capacity";
  reserved 13;
  reserved "active_run_leases";
  uint64 active_operations = 14;
  google.protobuf.Timestamp idle_deadline = 15;
}

message CreateRunnerRequest {
  // Absence selects the implicit local Device.
  DeviceRef device = 1;
  RunnerClassRef runner_class = 2;
  map<string, string> labels = 3;
  RunnerLifecycle lifecycle = 4;
  // Required only for RUNNER_LIFECYCLE_UNLESS_IDLE.
  google.protobuf.Duration idle_timeout = 5;
}

message CreateRunnerResponse {
  Runner runner = 1;
}

message ListRunnersRequest {}

message ListRunnersResponse {
  repeated Runner runners = 1;
}

message GetRunnerRequest {
  RunnerRef runner = 1;
}

message GetRunnerResponse {
  Runner runner = 1;
}

message DeleteRunnerRequest {
  RunnerRef runner = 1;
  // When absent, graceful draining waits without a deadline. A present zero
  // duration performs an immediate deadline check.
  google.protobuf.Duration grace_period = 2;
  // Immediately terminates a daemon-owned executable. Remote gRPC endpoints
  // are never terminated by deleting their local Runner resource.
  bool force = 3;
}

message DeleteRunnerResponse {
  Runner runner = 1;
}

message ListRunnerClassesRequest {
  // Absence selects the implicit local Device.
  DeviceRef device = 1;
}

message ListRunnerClassesResponse {
  repeated RunnerClass runner_classes = 1;
}

message GetRunnerClassRequest {
  // Absence selects the implicit local Device.
  DeviceRef device = 1;
  RunnerClassRef runner_class = 2;
}

message GetRunnerClassResponse {
  RunnerClass runner_class = 1;
}
