// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package auv.api.driver.v1;

import "auv/api/annotations/v1/annotations.proto";
import "auv/api/driver/v1/display.proto";
import "auv/api/driver/v1/geometry.proto";
import "auv/api/driver/v1/window.proto";
import "auv/api/image/v1/image.proto";
import "auv/api/image/v1/region.proto";

service CaptureService {
  rpc CaptureWindow(CaptureWindowRequest) returns (CaptureWindowResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_READ_ONLY;
  }
  rpc CaptureDisplay(CaptureDisplayRequest) returns (CaptureDisplayResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_READ_ONLY;
  }
  rpc CaptureRegion(CaptureRegionRequest) returns (CaptureRegionResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_READ_ONLY;
  }
  // Returns the pixels of a stored capture, optionally cropped, bounded and
  // encoded. This is the only call that moves AUV-produced pixels to a client.
  rpc GetCaptureImage(GetCaptureImageRequest) returns (GetCaptureImageResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_READ_ONLY;
  }
}

// A capture held in the capture store of the Runner that produced it. This is
// a Runner resource: it is valid only on a Run-affine route to the same Runner
// and fails with NOT_FOUND once evicted (see "Capture reference" in
// docs/TERMS_AND_CONCEPTS.md).
message CaptureRef {
  string capture_id = 1;
}

// A capture the Runner holds: its reference and metadata, never its pixels.
// Fetch pixels with GetCaptureImage.
message CapturedFrame {
  reserved 1;
  reserved "image";
  // Logical screen-space bounds represented by the captured pixels.
  ScreenRect bounds = 2;
  double scale_factor = 3;
  string backend = 4;
  optional string fallback_reason = 5;
  // Image top-left in its owning space. Missing means unbound, never screen by default.
  Position origin = 6;
  // Always set.
  CaptureRef ref = 7;
  // Physical pixel size.
  auv.api.image.v1.PixelSize pixel_size = 8;
  // ThumbHash (https://evanw.github.io/thumbhash/) of the whole capture, about
  // 20 bytes, for a blurred preview before `GetCaptureImage` returns pixels.
  bytes thumbhash = 9;
}

// Pixels with their screen placement, where pixels must travel: images a
// caller owns (RecognizeText) and frame-buffer frames.
// TODO(recent-frames-capture-refs): frame-buffer frames move to CapturedFrame
// references with the video stream; see
// docs/ai/references/driver/2026-10-06-capture-references-and-positions-design.md.
message ImageFrame {
  auv.api.image.v1.RgbaFrame image = 1;
  // Logical screen-space bounds represented by the pixels.
  ScreenRect bounds = 2;
  double scale_factor = 3;
  string backend = 4;
  optional string fallback_reason = 5;
  // Image top-left in its owning space. Missing means unbound, never screen by default.
  Position origin = 6;
}

message GetCaptureImageRequest {
  CaptureRef capture = 1;
  // Crop before resizing; absence keeps the whole capture.
  optional auv.api.image.v1.NormalizedRect region = 2;
  // The same area in logical screen coordinates, clipped to the capture.
  // Exclusive with `region`; a rectangle outside the capture is INVALID_ARGUMENT.
  ScreenRect screen_region = 5;
  // Fit inside this size, keeping the aspect ratio; never enlarges. Absence
  // keeps the native pixel size.
  auv.api.image.v1.PixelSize max_size = 3;
  // Absence (UNSPECIFIED) returns RGBA.
  auv.api.image.v1.ImageEncoding encoding = 4;
}

message GetCaptureImageResponse {
  reserved 1, 2;
  reserved "rgba", "encoded";
  // RGBA is raw rows; other encodings are container bytes.
  auv.api.image.v1.EncodedImage image = 3;
}

// The pixel resolution a capture is taken at.
enum CaptureResolution {
  // Native.
  CAPTURE_RESOLUTION_UNSPECIFIED = 0;
  // The display's backing pixels (2x on Retina). For OCR and small detail.
  CAPTURE_RESOLUTION_NATIVE = 1;
  // One pixel per logical point. For display and motion checks: a quarter of
  // a Retina capture's pixels, and the image lines up with logical bounds.
  CAPTURE_RESOLUTION_LOGICAL = 2;
}

message CaptureWindowRequest {
  reserved 1;
  reserved "lease";
  // A resolved child-resource reference. Selector convenience belongs in the
  // hierarchical client, which resolves once before entering this child API.
  WindowRef window = 2;
  CaptureResolution resolution = 3;
}

message CaptureWindowResponse {
  Window window = 1;
  CapturedFrame capture = 2;
}

message CaptureDisplayRequest {
  reserved 1;
  reserved "lease";
  // Absence selects the primary display.
  DisplaySelector selector = 2;
  CaptureResolution resolution = 3;
}

message CaptureDisplayResponse {
  Display display = 1;
  CapturedFrame capture = 2;
}

message CaptureRegionRequest {
  reserved 1;
  reserved "lease";
  ScreenRect region = 2;
  // Absence resolves the Display containing the requested screen region.
  DisplaySelector selector = 3;
  CaptureResolution resolution = 4;
}

message CaptureRegionResponse {
  Display display = 1;
  CapturedFrame capture = 2;
}
