// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package auv.api.driver.v1;

import "auv/api/annotations/v1/annotations.proto";
import "auv/api/driver/v1/capture.proto";
import "auv/api/driver/v1/geometry.proto";
import "auv/api/driver/v1/text_recognition.proto";
import "auv/api/driver/v1/window.proto";
import "auv/api/image/v1/region.proto";
import "google/protobuf/duration.proto";

service InputService {
  // NOTICE: Timed hold is a local driver convenience, not an RPC capability.
  // Remote convenience awaits an approved atomic sequence contract; client-side
  // sleep cannot preserve whole-gesture admission and cancellation cleanup.
  // Creates logical state in this Runner; it does not create an OS cursor.
  rpc CreateMouse(CreateMouseRequest) returns (CreateMouseResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Releases owned input before removing state; mouse zero cannot be deleted.
  rpc RemoveMouse(RemoveMouseRequest) returns (RemoveMouseResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Retains a desktop resource through MouseUp or timeout. Runs share mouse zero.
  rpc MouseDown(MouseDownRequest) returns (MouseDownResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Retries uncertain release; a known released mouse returns a Noop action.
  rpc MouseUp(MouseUpRequest) returns (MouseUpResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Complete press/movement/release. Cancellation attempts release on the same route.
  rpc DragMouse(DragMouseRequest) returns (DragMouseResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }

  // Validate the complete action list, then execute in order. Recipient identity
  // is bound once and checked before every action/repetition. No global fallback.
  // Older servers return UNIMPLEMENTED rather than ignoring a target.
  rpc InputKeyboard(InputKeyboardRequest) returns (InputKeyboardResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // One key combination, optionally repeated. Uses the InputKeyboard execution contract.
  rpc PressKeys(PressKeysRequest) returns (PressKeysResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // A bounded combination remains down until KeyUp or its release deadline.
  rpc KeyDown(KeyDownRequest) returns (KeyDownResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  rpc KeyUp(KeyUpRequest) returns (KeyUpResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // One call owns both transitions and the dwell between them.
  rpc HoldKeys(HoldKeysRequest) returns (HoldKeysResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }

  rpc ClickWindowPoint(ClickWindowPointRequest) returns (ClickWindowPointResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  rpc ClickScreenPoint(ClickScreenPointRequest) returns (ClickScreenPointResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Wheel-style scroll at a window-local point. Delivery evidence only: a
  // delivered wheel event does not prove the target viewport moved.
  // TODO(screen-point-scroll): screen/display-relative scroll is deferred until
  // a caller needs it; platform global scroll primitives do not share one API.
  rpc ScrollWindowPoint(ScrollWindowPointRequest) returns (ScrollWindowPointResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Spreads one window scroll over time with a timing function and streams
  // started, progress, and completed events. Invalid input ends the RPC with a
  // gRPC status before the first wheel event. The first non-empty sample
  // selects the delivery path; later samples reuse it.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc ScrollWindowPointMotion(ScrollWindowPointMotionRequest) returns (stream ScrollWindowPointMotionResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Live window scroll steered by caller velocity updates. The client sends one
  // begin event, then set_velocity events (each renews the lease), then stop
  // or cancel. Delivery starts after begin. A missing renewal within the lease
  // ramps to zero and completes; a disconnect stops at the next sample.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc StreamScroll(stream StreamScrollRequest) returns (stream StreamScrollResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Scrolls a window in steps and observes after each step (one capture per
  // update) until consecutive steps show no visual motion, the text query
  // becomes visible, the client decides to stop, or the step budget runs out.
  // The first request must be `begin`. Every update is streamed, with its
  // capture and recognized text unless opted out. With `await_decisions`, the
  // Runner waits for one `decision` after each update it does not end
  // itself; a half-closed request stream counts as a stop.
  // "No visual progress" is not proof that no more content exists.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc ScrollUntil(stream ScrollUntilRequest) returns (stream ScrollUntilResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Accepts one complete motion and streams delivery progress. Invalid input
  // ends the RPC with a gRPC status before the first pointer event.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc MoveMouse(MoveMouseRequest) returns (stream MoveMouseStreamResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Accepts one begin packet, ordered append packets, then finish or cancel.
  // Acceptance events can precede finish. Delivery starts only after finish,
  // because duration applies to the complete curve.
  rpc StreamMouseMotion(stream StreamMouseMotionRequest) returns (stream StreamMouseMotionResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  rpc TypeText(TypeTextRequest) returns (TypeTextResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  rpc PasteText(PasteTextRequest) returns (PasteTextResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
  // Legacy foreground convenience. Also accepts shortcut strings for released
  // callers; new key combinations use PressKeys. Implemented through InputKeyboard.
  rpc PressKey(PressKeyRequest) returns (PressKeyResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
  }
}

enum InputPolicy {
  INPUT_POLICY_UNSPECIFIED = 0;
  INPUT_POLICY_BACKGROUND_ONLY = 1;
  INPUT_POLICY_BACKGROUND_PREFERRED = 2;
  INPUT_POLICY_FOREGROUND_PREFERRED = 3;
}

enum WindowClickStrategy {
  WINDOW_CLICK_STRATEGY_UNSPECIFIED = 0;
  WINDOW_CLICK_STRATEGY_CHROMIUM_COMPATIBLE = 1;
  WINDOW_CLICK_STRATEGY_PID_TARGETED = 2;
}

enum TextSubmit {
  TEXT_SUBMIT_UNSPECIFIED = 0;
  TEXT_SUBMIT_NONE = 1;
  TEXT_SUBMIT_RETURN = 2;
  TEXT_SUBMIT_SEARCH = 3;
  TEXT_SUBMIT_DONE = 4;
  TEXT_SUBMIT_GO = 5;
}

enum InputDeliveryPath {
  INPUT_DELIVERY_PATH_UNSPECIFIED = 0;
  INPUT_DELIVERY_PATH_NOOP = 1;
  INPUT_DELIVERY_PATH_AX_PRESS = 2;
  INPUT_DELIVERY_PATH_AX_FOCUS = 3;
  INPUT_DELIVERY_PATH_AX_SET_VALUE = 4;
  INPUT_DELIVERY_PATH_AX_SCROLL = 5;
  INPUT_DELIVERY_PATH_AX_SELECTED_TEXT = 6;
  INPUT_DELIVERY_PATH_WINDOW_TARGETED_MOUSE = 7;
  INPUT_DELIVERY_PATH_WINDOW_TARGETED_WHEEL = 8;
  INPUT_DELIVERY_PATH_WINDOW_TARGETED_KEYBOARD = 9;
  INPUT_DELIVERY_PATH_WINDOW_TARGETED_KEYBOARD_SCROLL = 10;
  INPUT_DELIVERY_PATH_CLIPBOARD_PASTE = 11;
  INPUT_DELIVERY_PATH_FOREGROUND_SYSTEM_EVENTS = 12;
  INPUT_DELIVERY_PATH_UNSUPPORTED = 13;
}

enum DisturbanceLevel {
  DISTURBANCE_LEVEL_UNSPECIFIED = 0;
  DISTURBANCE_LEVEL_NONE = 1;
  DISTURBANCE_LEVEL_TEMPORARY = 2;
  DISTURBANCE_LEVEL_FOREGROUND = 3;
  DISTURBANCE_LEVEL_UNKNOWN = 4;
}

// Physical mouse button; omission selects the left button.
enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
}

message ClickOptions {
  InputPolicy policy = 1;
  Click click = 2;
  WindowClickStrategy window_strategy = 3;
  ClickModifiers modifiers = 4;
  MouseButton button = 5;
}

// Standard mouse-event modifier state, not physical keys or a persistent hold.
// Alt/Meta map to Option/Command on macOS. Missing fields are false.
// Foreground Windows/Linux delivery scopes key transitions to the click.
// Windows background messages support Shift/Control only; Linux has no
// window-targeted background input. Unsupported combinations are rejected.
// TODO(click-modifier-capabilities): old peers ignore this message. Mixed-version
// use awaits an approved Runner capability negotiation contract.
message ClickModifiers {
  bool shift = 1;
  bool control = 2;
  bool alt = 3;
  bool meta = 4;
}

// Screen-point delivery has no target Window policy or strategy. Keeping its
// options separate prevents callers from requesting behavior the Driver would
// have to ignore.
message ScreenClickOptions {
  Click click = 1;
  ClickModifiers modifiers = 2;
  MouseButton button = 3;
}

message Click {
  // Must be in [1, 255]. One is a single click, two is a double click, and
  // larger values are repeated clicks.
  uint32 count = 1;
  // Required and positive when count is greater than one; omitted for a
  // single click.
  google.protobuf.Duration interval = 2;
}

message TypeTextOptions {
  InputPolicy policy = 1;
  bool replace_existing = 2;
  TextSubmit submit = 3;
  // Absence uses the portable 8 ms default.
  google.protobuf.Duration inter_char_delay = 4;
  bool allow_clipboard_fallback = 5;
  google.protobuf.Duration settle = 6;
}

message PasteTextOptions {
  bool replace_existing = 1;
  TextSubmit submit = 2;
  google.protobuf.Duration settle = 3;
}

message InputAttempt {
  InputDeliveryPath path = 1;
  bool succeeded = 2;
  optional string message = 3;
}

// Wire projection of auv_driver::InputActionResult. This is delivery evidence,
// not proof that the target application reached a desired semantic state.
message InputActionResult {
  InputDeliveryPath selected_path = 1;
  repeated InputAttempt attempts = 2;
  DisturbanceLevel mouse_disturbance = 3;
  DisturbanceLevel focus_disturbance = 4;
  DisturbanceLevel clipboard_disturbance = 5;
}

message ClickWindowPointRequest {
  reserved 1;
  reserved "lease";
  // A previously resolved child resource. The Runner refreshes this reference
  // before delivery so stale platform handles are never trusted as snapshots.
  WindowRef window = 2;
  WindowPoint point = 3;
  ClickOptions options = 4;
}

message ClickWindowPointResponse {
  Window window = 1;
  WindowPoint point = 2;
  InputActionResult action = 3;
}

// Ordered pre-execution scroll delivery plan entry. The response's selected
// InputDeliveryPath is the post-execution fact.
enum ScrollDeliveryCandidate {
  SCROLL_DELIVERY_CANDIDATE_UNSPECIFIED = 0;
  SCROLL_DELIVERY_CANDIDATE_AX_SCROLL = 1;
  SCROLL_DELIVERY_CANDIDATE_WINDOW_TARGETED_WHEEL = 2;
  SCROLL_DELIVERY_CANDIDATE_WINDOW_TARGETED_KEYBOARD_SCROLL = 3;
  SCROLL_DELIVERY_CANDIDATE_FOREGROUND_HID = 4;
}

// Scroll amount in logical pixels of the target window's coordinate space.
// Positive delta_y moves the viewport toward later content (down) and positive
// delta_x moves it right, matching DOM WheelEvent. Both values must be finite
// and at least one must be non-zero. The Driver converts to native wheel units;
// the user's natural-scrolling preference does not apply.
message Scroll {
  double delta_x = 1;
  double delta_y = 2;
}

message ScrollOptions {
  InputPolicy policy = 1;
  // Ordered delivery candidates without duplicates. Empty selects the Driver
  // default ladder; the policy still decides whether foreground HID is legal.
  repeated ScrollDeliveryCandidate delivery_candidates = 2;
  google.protobuf.Duration settle = 3;
}

message ScrollWindowPointRequest {
  // A previously resolved child resource. The Runner refreshes this reference
  // before delivery so stale platform handles are never trusted as snapshots.
  WindowRef window = 1;
  WindowPoint point = 2;
  Scroll scroll = 3;
  ScrollOptions options = 4;
}

message ScrollWindowPointResponse {
  Window window = 1;
  WindowPoint point = 2;
  Scroll scroll = 3;
  InputActionResult action = 4;
}

// Standard timing functions mapping normalized time to normalized progress.
enum StandardMotionTimingFunction {
  STANDARD_MOTION_TIMING_FUNCTION_UNSPECIFIED = 0;
  STANDARD_MOTION_TIMING_FUNCTION_LINEAR = 1;
  STANDARD_MOTION_TIMING_FUNCTION_EASE_IN_CUBIC = 2;
  STANDARD_MOTION_TIMING_FUNCTION_EASE_OUT_CUBIC = 3;
  STANDARD_MOTION_TIMING_FUNCTION_EASE_IN_OUT_CUBIC = 4;
}

// CSS cubic-bezier(x1, y1, x2, y2). x1 and x2 must be within [0, 1]; y values
// may overshoot to scroll back and forth.
message CubicBezierMotionTimingFunction {
  double x1 = 1;
  double y1 = 2;
  double x2 = 3;
  double y2 = 4;
}

message MotionTimingFunction {
  oneof function {
    StandardMotionTimingFunction standard = 1;
    CubicBezierMotionTimingFunction cubic_bezier = 2;
  }
}

message FixedDurationMotionTiming {
  // Zero delivers the total as one immediate sample.
  google.protobuf.Duration duration = 1;
  // Absence selects linear timing.
  MotionTimingFunction function = 2;
}

message ScrollMotion {
  // Total in logical pixels; positive is toward later content (down/right).
  Scroll total = 1;
  oneof timing {
    FixedDurationMotionTiming fixed_duration = 2;
  }
  // Must be positive when the duration is positive.
  uint32 sample_rate_hz = 3;
}

message ScrollWindowPointMotionRequest {
  // A previously resolved child resource, refreshed before delivery.
  WindowRef window = 1;
  WindowPoint point = 2;
  ScrollMotion motion = 3;
  ScrollOptions options = 4;
}

message ScrollMotionStarted {
  Window window = 1;
  WindowPoint point = 2;
  // Planned samples can be skipped when delivery falls behind schedule.
  uint64 planned_sample_count = 3;
  google.protobuf.Duration duration = 4;
}

message ScrollMotionProgress {
  // This index can skip values when overdue samples are coalesced.
  uint64 sample_index = 1;
  google.protobuf.Duration scheduled_elapsed = 2;
  // Logical pixels delivered so far.
  Scroll delivered = 3;
}

message ScrollMotionCompleted {
  // Logical pixels delivered; the total quantized to native wheel units.
  Scroll delivered = 1;
  // Delivery evidence of the first non-empty sample.
  InputActionResult action = 2;
}

message ScrollWindowPointMotionResponse {
  oneof event {
    ScrollMotionStarted started = 1;
    ScrollMotionProgress progress = 2;
    ScrollMotionCompleted completed = 3;
  }
}

// Logical pixels per second; positive is toward later content (down/right).
message ScrollVelocity {
  double delta_x_per_second = 1;
  double delta_y_per_second = 2;
}

message StreamScrollBegin {
  // A previously resolved child resource, refreshed before delivery.
  WindowRef window = 1;
  WindowPoint point = 2;
  ScrollOptions options = 3;
  // Samples per second, 1..=1000.
  uint32 sample_rate_hz = 4;
  // Limit on velocity change in logical px/s^2. Absence jumps to each
  // requested velocity.
  optional double max_acceleration = 5;
  // Required, (0, 60s]. Every set_velocity renews it.
  google.protobuf.Duration lease = 6;
}

message StreamScrollSetVelocity {
  ScrollVelocity velocity = 1;
}

// Ramps to zero (subject to max_acceleration), then completes.
message StreamScrollStop {}

// Ends delivery at the next sample without ramping.
message StreamScrollCancel {}

message StreamScrollRequest {
  // Begin must occur once and first.
  oneof event {
    StreamScrollBegin begin = 1;
    StreamScrollSetVelocity set_velocity = 2;
    StreamScrollStop stop = 3;
    StreamScrollCancel cancel = 4;
  }
}

enum ScrollStreamStopReason {
  SCROLL_STREAM_STOP_REASON_UNSPECIFIED = 0;
  SCROLL_STREAM_STOP_REASON_STOPPED = 1;
  SCROLL_STREAM_STOP_REASON_CANCELLED = 2;
  SCROLL_STREAM_STOP_REASON_LEASE_EXPIRED = 3;
}

message StreamScrollStarted {
  Window window = 1;
  WindowPoint point = 2;
}

message StreamScrollProgress {
  google.protobuf.Duration elapsed = 1;
  // Logical pixels delivered so far.
  Scroll delivered = 2;
  // Current, possibly ramping, velocity.
  ScrollVelocity velocity = 3;
}

message StreamScrollCompleted {
  Scroll delivered = 1;
  // Delivery evidence of the first non-empty sample; absent if nothing moved.
  InputActionResult action = 2;
  ScrollStreamStopReason reason = 3;
  google.protobuf.Duration elapsed = 4;
}

message StreamScrollResponse {
  oneof event {
    StreamScrollStarted started = 1;
    StreamScrollProgress progress = 2;
    StreamScrollCompleted completed = 3;
  }
}

// Stop when consecutive steps show no visual motion.
message ScrollUntilEnd {}

// Stop when recognized window text contains the query; reaching the end
// without a match also stops.
message ScrollUntilTextVisible {
  string query = 1;
}

// Opt-outs for update payloads; everything is included by default.
// Motion evidence is always included. A text condition still recognizes text
// when `omit_text` is set; only the update omits it.
message ScrollUntilOutputOptions {
  // Captures always travel by reference, so there is nothing to omit.
  reserved 1;
  reserved "omit_capture";
  bool omit_text = 2;
}

message ScrollUntilBegin {
  // A previously resolved child resource, refreshed before delivery.
  WindowRef window = 1;
  WindowPoint point = 2;
  // One axis only, finite and non-zero, in logical pixels per step.
  oneof step {
    Scroll instant = 3;
    ScrollMotion motion = 4;
  }
  oneof condition {
    ScrollUntilEnd end = 5;
    ScrollUntilTextVisible text_visible = 6;
  }
  // 1..=1000.
  uint32 max_steps = 7;
  // Wait after each step before observing, at most 10s. Absence is zero.
  google.protobuf.Duration settle = 8;
  // Consecutive no-motion updates that count as the end, 1..=10.
  uint32 no_motion_confirmations = 9;
  // Region of the window compared for motion; absence is the whole window.
  optional auv.api.image.v1.NormalizedRect motion_region = 10;
  ScrollOptions options = 11;
  ScrollUntilOutputOptions output = 12;
  // The client runs a predicate and answers each update that has
  // `awaiting_decision` set.
  bool await_decisions = 13;
}

// The client's verdict on the latest update awaiting a decision.
message ScrollUntilDecision {
  bool stop = 1;
}

message ScrollUntilRequest {
  oneof event {
    ScrollUntilBegin begin = 1;
    ScrollUntilDecision decision = 2;
  }
}

enum ScrollUntilStopReason {
  SCROLL_UNTIL_STOP_REASON_UNSPECIFIED = 0;
  SCROLL_UNTIL_STOP_REASON_END_BY_NO_VISUAL_PROGRESS = 1;
  SCROLL_UNTIL_STOP_REASON_TEXT_VISIBLE = 2;
  SCROLL_UNTIL_STOP_REASON_BUDGET_EXHAUSTED = 3;
  // The client's decision stopped the loop.
  SCROLL_UNTIL_STOP_REASON_PREDICATE_SATISFIED = 4;
}

message ViewportPixelMotion {
  // Best content shift in image pixels along the scroll axis.
  int32 estimated_shift = 1;
  // Mean absolute RGB difference in [0, 1] at that shift.
  double normalized_diff = 2;
  bool no_motion = 3;
}

message ScrollUntilTextMatch {
  string text = 1;
  ScreenRect bounds = 2;
}

// What the Runner saw before the first step (`steps` 0) and after each step.
// NOTICE(domain-result-names): This is a coordinated breaking rename, without
// legacy message/field aliases. See the 2026-10-08 domain-result naming migration.
message ScrollUntilUpdate {
  uint32 steps = 1;
  Scroll delivered = 2;
  // Absent before the first step.
  ViewportPixelMotion motion = 3;
  uint32 no_motion_streak = 4;
  // This step's capture by reference, without pixels.
  CapturedFrame capture = 5;
  // Same shape as `TextRecognitionService/RecognizeText`; absent when opted out.
  RecognizeTextResponse text = 6;
  // Set when a built-in condition or the budget ends the loop here.
  ScrollUntilStopReason stop = 7;
  // The Runner waits for one `decision` before continuing.
  bool awaiting_decision = 8;
}

message ScrollUntilCompleted {
  ScrollUntilStopReason reason = 1;
  uint32 steps = 2;
  Scroll delivered = 3;
  // Delivery evidence of the first step; absent if the loop stopped before any step.
  InputActionResult action = 4;
  ScrollUntilTextMatch text_match = 5;
  ViewportPixelMotion last_motion = 6;
}

message ScrollUntilResponse {
  oneof event {
    ScrollUntilUpdate update = 1;
    ScrollUntilCompleted completed = 2;
  }
}

message ClickScreenPointRequest {
  reserved 1;
  reserved "lease";
  ScreenPoint point = 2;
  ScreenClickOptions options = 3;
}

message ClickScreenPointResponse {
  ScreenPoint point = 1;
  InputActionResult action = 2;
}

message MouseCurrentPosition {}

message MouseStart {
  oneof source {
    ScreenPoint point = 1;
    MouseCurrentPosition current = 2;
  }
}

message MouseCurvePoint {
  double x = 1;
  double y = 2;
}

message MouseCubicBezierSegment {
  MouseCurvePoint control_1 = 1;
  MouseCurvePoint control_2 = 2;
  MouseCurvePoint end = 3;
}

message MouseCurve {
  MouseCurvePoint start = 1;
  repeated MouseCubicBezierSegment segments = 2;
}

message MouseCurveMapping {
  // Logical screen displacement represented by one local curve unit.
  double width = 1;
  double height = 2;
}

message MouseMotionOptions {
  google.protobuf.Duration duration = 1;
  uint32 sample_rate_hz = 2;
  // Positive screen-space arc-length approximation tolerance for nonempty curves.
  double curve_tolerance = 3;
}

// Screen-space points, including for a window-targeted route. An omitted
// target continues a held route or selects foreground delivery when released.
message MoveMouseRequest {
  reserved 1;
  reserved "plan";
  MouseStart start = 2;
  MouseCurve curve = 3;
  MouseCurveMapping mapping = 4;
  MouseMotionOptions options = 5;
  // Zero selects the shared default mouse; IDs otherwise come from CreateMouse.
  uint64 mouse = 6;
  InputTarget target = 7;
}

message MouseMotionStarted {
  ScreenPoint resolved_start = 1;
  // Planned samples can be skipped when delivery falls behind schedule.
  uint64 planned_sample_count = 2;
  google.protobuf.Duration duration = 3;
}

message MouseMotionProgress {
  // This index can skip values when overdue intermediate samples are coalesced.
  uint64 sample_index = 1;
  ScreenPoint point = 2;
  google.protobuf.Duration scheduled_elapsed = 3;
}

message MouseMotionCompleted {
  ScreenPoint point = 1;
  InputActionResult action = 2;
}

message MoveMouseStreamResponse {
  oneof event {
    MouseMotionStarted started = 1;
    MouseMotionProgress progress = 2;
    MouseMotionCompleted completed = 3;
  }
}

message StreamMouseMotionBegin {
  InputTarget target = 6;
  uint64 mouse = 5;
  MouseStart start = 1;
  MouseCurvePoint curve_start = 2;
  MouseCurveMapping mapping = 3;
  MouseMotionOptions options = 4;
}

message StreamMouseMotionAppend {
  // Starts at zero and must increase by one for every accepted batch.
  uint32 sequence = 1;
  repeated MouseCubicBezierSegment segments = 2;
}

message StreamMouseMotionFinish {}

message StreamMouseMotionCancel {}

message StreamMouseMotionRequest {
  // Begin must occur once and first. Append can repeat with consecutive
  // sequence values. Finish or cancel must occur once and last.
  oneof event {
    StreamMouseMotionBegin begin = 1;
    StreamMouseMotionAppend append = 2;
    StreamMouseMotionFinish finish = 3;
    StreamMouseMotionCancel cancel = 4;
  }
}

message StreamMouseMotionAccepted {
  uint32 next_sequence = 1;
}

message MouseMotionCancelled {}

message StreamMouseMotionResponse {
  // Accepted can repeat before finish. Started, progress, and completed occur
  // in that order after finish. Cancelled is terminal and replaces delivery.
  oneof event {
    StreamMouseMotionAccepted accepted = 1;
    MouseMotionStarted started = 2;
    MouseMotionProgress progress = 3;
    MouseMotionCompleted completed = 4;
    MouseMotionCancelled cancelled = 5;
  }
}

message TypeTextRequest {
  reserved 1;
  reserved "lease";
  string text = 2;
  TypeTextOptions options = 3;
}

message TypeTextResponse {
  InputActionResult action = 1;
}

message PasteTextRequest {
  reserved 1;
  reserved "lease";
  string text = 2;
  PasteTextOptions options = 3;
}

message PasteTextResponse {
  InputActionResult action = 1;
}

message PressKeyRequest {
  reserved 1;
  reserved "lease";
  // Physical key name/ANSI character or legacy shortcut. Use TypeText for Unicode.
  string key = 2;
  google.protobuf.Duration settle = 3;
}

message PressKeyResponse {
  InputActionResult action = 1;
}

// Explicit recipient selection. A missing target is invalid, never global input.
message InputTarget {
  oneof recipient {
    // Only ref and observed process_id establish identity; other fields are not
    // trusted as current state. A window is not a text-control selector.
    Window window = 1;
    string application_bundle_id = 2;
    // Must be true. Global delivery depends on the current foreground control.
    bool foreground = 3;
  }
}

message PressKeysOptions {
  // Modifiers plus any supported physical keys. Modifiers are pressed first;
  // other keys preserve order. Release is reversed. Duplicate keys are invalid.
  repeated string keys = 1;
  // Absence means one complete press/release; explicit values must be 1..255.
  optional uint32 count = 2;
  // Positive for repeated presses; zero/absent for a single press.
  google.protobuf.Duration interval = 3;
  google.protobuf.Duration settle = 4;
}

message KeyboardPress {
  PressKeysOptions options = 1;
  InputPolicy policy = 2;
}

message KeyboardPaste {
  string text = 1;
  PasteTextOptions options = 2;
  InputPolicy policy = 3;
}

// Policy belongs to the action. TypeTextOptions.policy is the sole text policy.
// A list is ordered actions, not a key combination or a transaction. No whole-list repeat.
message KeyboardInput {
  oneof action {
    KeyboardPress press = 1;
    TypeTextRequest type_text = 2;
    KeyboardPaste paste_text = 3;
  }
}

message InputKeyboardRequest {
  InputTarget target = 1;
  repeated KeyboardInput inputs = 2;
  // Full validation without activation, clipboard changes, sleeps, or delivery.
  bool dry_run = 3;
}

message InputKeyboardResponse {
  // One result per action; empty for dry-run. Posting is not semantic success.
  repeated InputActionResult actions = 1;
}

// Encoded in gRPC Status.details for driver validation/delivery failures.
// The status code/message retains the underlying cause. Do not retry the whole
// request blindly: the failed action can itself have partially affected the UI.
message KeyboardInputProgress {
  repeated InputActionResult completed = 1;
  // Zero-based index of the failed action, including preflight validation.
  optional uint32 action_index = 2;
  // Fully submitted repetitions inside the failed press action.
  uint32 completed_presses = 3;
}

message PressKeysRequest {
  InputTarget target = 1;
  PressKeysOptions options = 2;
  InputPolicy policy = 3;
  bool dry_run = 4;
}

message PressKeysResponse {
  // Absent for dry-run. Errors carry KeyboardInputProgress like InputKeyboard.
  InputActionResult action = 1;
}

message KeyDownRequest {
  InputTarget target = 1;
  repeated string keys = 2;
  // Unspecified selects foreground-preferred.
  InputPolicy policy = 3;
  // Required, positive, and bounded by the Runner. Timeout attempts release.
  google.protobuf.Duration timeout = 4;
}
message KeyDownResponse {
  uint64 hold_id = 1;
  InputActionResult action = 2;
}
message KeyUpRequest {
  uint64 hold_id = 1;
}
message KeyUpResponse {
  InputActionResult action = 1;
}
message HoldKeysRequest {
  InputTarget target = 1;
  repeated string keys = 2;
  // Unspecified selects foreground-preferred.
  InputPolicy policy = 3;
  // Required, positive. The call returns after release is attempted.
  google.protobuf.Duration duration = 4;
}
message HoldKeysResponse {
  InputActionResult action = 1;
}

message CreateMouseRequest {}
message CreateMouseResponse {
  uint64 mouse = 1;
}

message RemoveMouseRequest {
  uint64 mouse = 1;
}
message RemoveMouseResponse {
  InputActionResult action = 1;
}

message MouseDownRequest {
  // Zero selects the shared default mouse.
  uint64 mouse = 1;
  ScreenPoint point = 2;
  MouseButton button = 3;
  // Omission uses 30 seconds; explicit values must be positive.
  // This is a caller-selected release deadline, not a maximum hold duration.
  google.protobuf.Duration timeout = 4;
  // Omission selects foreground. Applications without a window are unsupported.
  InputTarget target = 5;
}
message MouseDownResponse {
  InputActionResult action = 1;
}

message MouseUpRequest {
  uint64 mouse = 1;
}
message MouseUpResponse {
  InputActionResult action = 1;
}

message DragMouseRequest {
  MoveMouseRequest movement = 1;
  MouseButton button = 2;
}

message DragMouseResponse {
  ScreenPoint point = 1;
  InputActionResult action = 2;
}
