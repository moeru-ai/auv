// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package auv.api.driver.macos.v1;

import "auv/api/annotations/v1/annotations.proto";

// Reads the system-wide macOS MediaRemote state. The owning application is
// reported by source_bundle_id; this service does not filter by application.
service MediaService {
  rpc GetNowPlaying(GetNowPlayingRequest) returns (GetNowPlayingResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_READ_ONLY;
    option (auv.api.annotations.v1.presentation) = {
      name: "media.getNowPlaying"
      title: "Get now playing"
      description: "Returns the track the system media session reports as now playing, and whether it is playing."
    };
  }
  rpc PlayMedia(PlayMediaRequest) returns (PlayMediaResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
    option (auv.api.annotations.v1.presentation) = {
      name: "media.play"
      title: "Play media"
      description: "Resumes playback in the app that owns the system media session."
    };
  }
  rpc PauseMedia(PauseMediaRequest) returns (PauseMediaResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
    option (auv.api.annotations.v1.presentation) = {
      name: "media.pause"
      title: "Pause media"
      description: "Pauses playback in the app that owns the system media session."
    };
  }
  rpc ToggleMediaPlayback(ToggleMediaPlaybackRequest) returns (ToggleMediaPlaybackResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
    option (auv.api.annotations.v1.presentation) = {
      name: "media.togglePlayback"
      title: "Toggle play and pause"
      description: "Toggles playback in the app that owns the system media session."
    };
  }
  rpc SkipToNextTrack(SkipToNextTrackRequest) returns (SkipToNextTrackResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
    option (auv.api.annotations.v1.presentation) = {
      name: "media.skipToNextTrack"
      title: "Next track"
      description: "Skips to the next track in the app that owns the system media session."
    };
  }
  rpc SkipToPreviousTrack(SkipToPreviousTrackRequest) returns (SkipToPreviousTrackResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_INPUT;
    option (auv.api.annotations.v1.presentation) = {
      name: "media.skipToPreviousTrack"
      title: "Previous track"
      description: "Goes back to the previous track in the app that owns the system media session."
    };
  }
}

message GetNowPlayingRequest {
  reserved 1;
  reserved "lease";
}

message GetNowPlayingResponse {
  NowPlayingState state = 1;
}

message PlayMediaRequest {
  reserved 1;
  reserved "lease";
}
message PlayMediaResponse {
  MediaControlOutcome outcome = 1;
}
message PauseMediaRequest {
  reserved 1;
  reserved "lease";
}
message PauseMediaResponse {
  MediaControlOutcome outcome = 1;
}
message ToggleMediaPlaybackRequest {
  reserved 1;
  reserved "lease";
}
message ToggleMediaPlaybackResponse {
  MediaControlOutcome outcome = 1;
}
message SkipToNextTrackRequest {
  reserved 1;
  reserved "lease";
}
message SkipToNextTrackResponse {
  MediaControlOutcome outcome = 1;
}
message SkipToPreviousTrackRequest {
  reserved 1;
  reserved "lease";
}
message SkipToPreviousTrackResponse {
  MediaControlOutcome outcome = 1;
}

// The observable evidence around one transport command. The RPC method is the
// command identity, so the outcome does not repeat it as a generic enum.
message MediaControlOutcome {
  NowPlayingState before = 1;
  NowPlayingState after = 2;
  // False means the fixed observation window did not prove the command's
  // postcondition. It does not mean command delivery failed.
  bool verified = 3;
}

// Exact wire projection of auv_media_macos::NowPlayingState. Time values remain
// optional floating-point seconds because that is the owning backend contract.
message NowPlayingState {
  bool present = 1;
  bool is_playing = 2;
  optional string source_bundle_id = 3;
  optional string title = 4;
  optional string artist = 5;
  optional string album = 6;
  optional double duration_seconds = 7;
  optional double elapsed_seconds = 8;
  optional double playback_rate = 9;
  optional string content_item_id = 10;
  // Presence is significant: absent means the backend did not report whether
  // the current item exposes a like/favorite affordance.
  optional bool supports_like = 11;
  // Presence is significant: absent means like/favorite state is unreported.
  optional bool is_liked = 12;
}
