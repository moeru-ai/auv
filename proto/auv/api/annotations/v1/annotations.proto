// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package auv.api.annotations.v1;

import "google/protobuf/descriptor.proto";

enum MethodEffect {
  METHOD_EFFECT_UNSPECIFIED = 0;
  METHOD_EFFECT_READ_ONLY = 1;
  METHOD_EFFECT_MUTATION = 2;
  METHOD_EFFECT_INPUT = 3;
  METHOD_EFFECT_ADMINISTRATION = 4;
}

// How a method is presented to people and tools. Long-form docs and examples
// live in Markdown next to the schema (`docs/<name>.md`) and are served by
// `MethodDocsService`.
message MethodPresentation {
  // The operation id: `<service resource>.<rpc without the resource noun>` in
  // lower camelCase, e.g. "window.findText" for WindowService.FindWindowText.
  // The invoke command and the MCP tool use the same id.
  string name = 1;
  // A short title, e.g. "Find text in a window".
  string title = 2;
  // One plain-text paragraph, usable as a JSDoc comment or a Python
  // docstring; no Markdown and no internal notes.
  string description = 3;
}

// Optional DevTools/Inspector discovery metadata. These options do not define
// routing, authentication, Device context, or Run context.
extend google.protobuf.MethodOptions {
  bool discoverable = 51001;
  MethodEffect effect = 51002;
  MethodPresentation presentation = 51003;
}
