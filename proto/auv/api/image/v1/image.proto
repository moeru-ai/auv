// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package auv.api.image.v1;

message PixelSize {
  uint32 width = 1;
  uint32 height = 2;
}

message RgbFrame {
  uint32 width = 1;
  uint32 height = 2;
  // Tightly packed RGB8 pixels in row-major order. The exact byte length is
  // width * height * 3.
  bytes data = 3;
}

enum ImageEncoding {
  IMAGE_ENCODING_UNSPECIFIED = 0;
  // Tightly packed RGBA8 rows (width * height * 4 bytes); the default.
  IMAGE_ENCODING_RGBA = 1;
  IMAGE_ENCODING_PNG = 2;
  // Fixed quality 85.
  IMAGE_ENCODING_JPEG = 3;
  // Lossless WebP: exact pixels, usually 30–70% smaller than PNG for UI.
  IMAGE_ENCODING_WEBP = 4;
}

// Image bytes in `encoding`: raw RGBA8 rows, or PNG, JPEG or WebP container bytes.
message EncodedImage {
  ImageEncoding encoding = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes data = 4;
}

message RgbaFrame {
  uint32 width = 1;
  uint32 height = 2;
  // Tightly packed RGBA8 pixels in row-major order. The exact byte length is
  // width * height * 4.
  bytes data = 3;
}
