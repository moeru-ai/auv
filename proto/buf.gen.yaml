version: v2
plugins:
  # Rust generation has one owner: crates/auv-api-proto/build.rs. Buf owns the
  # checked-in cross-language SDK output and pins both upstream version and BSR
  # rebuild revision for reproducibility.
  - remote: buf.build/bufbuild/es:v2.13.0
    revision: 1
    out: js/packages/api-client/src/gen
    opt:
      - target=ts
      - import_extension=js
