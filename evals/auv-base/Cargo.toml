[package]
name = "auv-base-evals"

version.workspace = true

edition.workspace = true

rust-version.workspace = true

license.workspace = true

publish = false

[lib]
path = "tasks/lib.rs"

[[bin]]
name = "keyboard-eval"
path = "platforms/desktop-macos/tasks/keyboard.rs"

[[bin]]
name = "focus-eval"
path = "platforms/desktop-macos/tasks/focus_without_raise.rs"

[[bin]]
name = "keyboard-receiver-sender"
path = "platforms/desktop-macos/tasks/keyboard_sender.rs"

[[bin]]
name = "win32-receiver"
path = "platforms/desktop-windows/test-objects/win32/receiver.rs"

[[bin]]
name = "background-session-eval"
path = "platforms/desktop-windows/tasks/background_session.rs"

[[test]]
name = "appkit-keyboard"
path = "platforms/desktop-macos/cases/appkit_keyboard.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = [ "derive" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
  "sync",
  "io-util",
  "net",
  "signal",
] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
auv-driver-common = { path = "../../crates/auv-driver-common" }
auv-driver-macos = { path = "../../crates/auv-driver-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
auv-driver-common = { path = "../../crates/auv-driver-common" }
auv-driver-windows = { path = "../../crates/auv-driver-windows" }
image = { version = "0.25", default-features = false, features = [ "png", "webp" ] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
