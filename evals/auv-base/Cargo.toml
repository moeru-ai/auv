[package]
name = "auv-base-evals"

version.workspace = true

edition.workspace = true

rust-version.workspace = true

license.workspace = true

publish = false

[lib]
path = "tasks/lib.rs"

[[bin]]
name = "keyboard-eval"
path = "platforms/desktop-macos/tasks/keyboard.rs"

[[bin]]
name = "focus-eval"
path = "platforms/desktop-macos/tasks/focus_without_raise.rs"

[[bin]]
name = "keyboard-receiver-sender"
path = "platforms/desktop-macos/tasks/keyboard_sender.rs"

[[test]]
name = "appkit-keyboard"
path = "platforms/desktop-macos/cases/appkit_keyboard.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = [ "derive" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
  "sync",
  "io-util",
  "net",
  "signal",
] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
auv-driver-common = { path = "../../crates/auv-driver-common" }
auv-driver-macos = { path = "../../crates/auv-driver-macos" }
