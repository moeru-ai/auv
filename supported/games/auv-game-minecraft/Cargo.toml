[package]
name = "auv-game-minecraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
tracing = [
  "dep:auv-tracing",
  "dep:thiserror",
]

[dependencies]
auv-file = { path = "../../../crates/auv-file" }
auv-query-readiness = { path = "../../../crates/auv-query-readiness" }
auv-driver = { path = "../../../crates/auv-driver" }
auv-tracing = { path = "../../../crates/auv-tracing", optional = true }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror = { workspace = true, optional = true }

[dev-dependencies]
auv-tracing = { path = "../../../crates/auv-tracing", features = ["memory-store"] }
futures-executor = "0.3"
tempfile.workspace = true

[[test]]
name = "integrated"
