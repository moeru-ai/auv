[package]
name = "auv-game-minecraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
tracing = [
  "dep:auv-tracing",
  "dep:thiserror",
]

[dependencies]
auv-file = { path = "../../../crates/auv-file" }
auv-query-readiness = { path = "../../../crates/auv-query-readiness" }
auv-driver = { path = "../../../crates/auv-driver" }
auv-tracing = { path = "../../../crates/auv-tracing", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = { version = "2", optional = true }

[dev-dependencies]
auv-tracing = { path = "../../../crates/auv-tracing", features = ["memory-store"] }
futures-executor = "0.3"
tempfile = "3"

[[test]]
name = "integrated"
