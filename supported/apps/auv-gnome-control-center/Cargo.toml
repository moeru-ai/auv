[package]
name = "auv-gnome-control-center"
version.workspace = true
edition.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "GNOME Control Center for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
tracing = ["dep:auv-tracing"]

[dependencies]
auv-driver = { path = "../../../crates/auv-driver" }
auv-tracing = { path = "../../../crates/auv-tracing", optional = true }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
auv-driver-linux = { path = "../../../crates/auv-driver-linux" }
