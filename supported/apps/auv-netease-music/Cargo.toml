[package]
name = "auv-netease-music"
version.workspace = true
edition.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
tracing = ["auv-media-macos/tracing"]

[[bin]]
name = "auv-netease-music"
path = "src/bin/auv-netease-music.rs"
required-features = ["tracing"]

[[bin]]
name = "auv-runner-netease-music"
path = "src/bin/auv-runner-netease-music.rs"

[dependencies]
auv = { path = "../../../crates/auv" }
auv-cli-common = { path = "../../../crates/auv-cli-common" }
auv-api-client = { path = "../../../crates/auv-api-client" }
auv-api-proto = { path = "../../../crates/auv-api-proto" }
auv-api-server = { path = "../../../crates/auv-api-server" }
auv-driver = { path = "../../../crates/auv-driver" }
# auv-media-macos compiles on all targets (non-macOS calls return Unsupported),
# so it is a normal dependency — this lets the platform-neutral CLI reuse its
# `MediaCommand` type instead of re-declaring it.
auv-media-macos = { path = "../../../crates/auv-media-macos" }
auv-view = { path = "../../../crates/auv-view" }
auv-tracing = { path = "../../../crates/auv-tracing", features = ["file-store"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
thiserror = "2"
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
auv-daemon = { path = "../../../crates/auv-daemon" }
tempfile = "3"
tokio-util = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
auv-driver-macos = { path = "../../../crates/auv-driver-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
auv-driver-windows = { path = "../../../crates/auv-driver-windows" }
