[package]
name = "auv-apple-textedit"
version.workspace = true
edition.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
tracing = ["dep:auv-tracing"]
invoke = ["tracing", "dep:auv-cli-invoke"]

[dependencies]
auv-cli-invoke = { path = "../../../crates/auv-cli-invoke", optional = true }
auv-driver = { path = "../../../crates/auv-driver" }
auv-tracing = { path = "../../../crates/auv-tracing", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
auv-driver-macos = { path = "../../../crates/auv-driver-macos" }
