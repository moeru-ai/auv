[package]
name = "auv-driver-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Selectable native desktop drivers for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
linux-wayland = ["dep:wayland-client", "dep:wayland-protocols"]
macos-xcap = ["dep:xcap"]
windows-xcap = ["dep:xcap"]
windows-win32 = ["dep:windows"]

[dependencies]
auv-driver-desktop-common = { version = "0.0.43", path = "../auv-driver-desktop-common" }
auv-driver-common = { version = "0.0.43", path = "../auv-driver-common" }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "unstable"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = { version = "0.6", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", optional = true, features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_StationsAndDesktops",
  "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"
] }
