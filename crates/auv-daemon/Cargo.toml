[package]
name = "auv-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Server-side SDK for hosting an AUV daemon"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
auv = { package = "auv-core", version = "0.0.22", path = "../auv" }
auv-api-client = { version = "0.0.22", path = "../auv-api-client" }
auv-api-proto = { version = "0.0.22", path = "../auv-api-proto" }
auv-api-server = { version = "0.0.22", path = "../auv-api-server" }
fs2 = "0.4"
getrandom = "0.3"
hex = "0.4"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7"] }

[target.'cfg(target_os = "linux")'.dependencies]
auv-driver-linux = { version = "0.0.22", path = "../auv-driver-linux" }
libloading = "0.8"
zbus = "5.15"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
auv-device-helper-macos = { version = "0.0.22", path = "../auv-device-helper-macos" }
auv-driver-macos = { version = "0.0.22", path = "../auv-driver-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
auv-driver-windows = { version = "0.0.22", path = "../auv-driver-windows" }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
zeroize = "1"

[dev-dependencies]
futures-util = "0.3"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-reflection = "0.14"
tokio-tungstenite = "0.29"
