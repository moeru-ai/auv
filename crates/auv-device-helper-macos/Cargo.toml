[package]
name = "auv-device-helper-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme = "README.md"
license.workspace = true
authors.workspace = true
description = "Signed macOS graphical helper for existing-session Device entry"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
serde_json = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
auv-driver-macos = { version = "0.0.22", path = "../auv-driver-macos" }
core-foundation = "0.10"
nix = { version = "0.31", features = ["socket"] }
rustix = { version = "1", features = ["process"] }
security-framework = "3.7"
security-framework-sys = "2.17"
tokio = { version = "1", features = ["macros", "net", "rt", "io-util", "time"] }
