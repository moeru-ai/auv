[package]
name = "auv-driver-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Capture contracts and platform capture providers for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
auv-driver-common = { version = "0.0.43", path = "../auv-driver-common" }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
auv-driver-desktop-linux = { version = "0.0.43", path = "../auv-driver-desktop-linux" }
auv-driver-portal-linux = { version = "0.0.43", path = "../auv-driver-portal-linux" }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast", "screenshot"] }
pipewire = "0.8"
url = "2"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
