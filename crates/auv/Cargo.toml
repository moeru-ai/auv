[package]
name = "auv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Domain-facing local and remote operation interface for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
auv-api-client = { path = "../auv-api-client" }
auv-api-proto = { path = "../auv-api-proto" }
auv-driver = { path = "../auv-driver" }
auv-driver-overlay-common = { path = "../auv-driver-overlay-common" }
auv-media-macos = { path = "../auv-media-macos" }
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
http = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tonic = { version = "0.14", features = ["transport"] }
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Ocr",
  "Graphics_Imaging",
  "Security_Cryptography",
  "Globalization",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem"
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
