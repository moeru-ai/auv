[package]
name = "auv-release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Builds and verifies AUV release artifacts"

[[bin]]
name = "auv-release"
path = "src/main.rs"

[dependencies]
auv-bundle-layout = { path = "../auv-bundle-layout" }
clap = { version = "4.5", features = ["derive"] }
object = { version = "0.37", default-features = false, features = ["elf", "read_core", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
