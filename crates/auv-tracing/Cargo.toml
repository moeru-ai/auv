[package]
name = "auv-tracing"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Optional tracing & logging for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
memory-store = []
file-store = []

[dependencies]
futures-io = "0.3"
futures-util = { version = "0.3", features = ["io", "sink"] }
futures-channel = "0.3"
futures-executor = { version = "0.3", features = ["thread-pool"] }
hex = "0.4"
pin-project = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
thiserror = "2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "emission_pipeline_contract"
required-features = ["memory-store"]

[[test]]
name = "file_store_contract"
required-features = ["file-store"]
