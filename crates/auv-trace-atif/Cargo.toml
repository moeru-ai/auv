[package]
name = "auv-trace-atif"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Standalone exporter from AUV trace stores to ATIF trajectories"

[[bin]]
name = "auv-trace-atif"
path = "src/main.rs"

[dependencies]
auv-tracing = { path = "../auv-tracing", features = ["file-store"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures-executor = "0.3"
futures-util = { version = "0.3", features = ["io"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
