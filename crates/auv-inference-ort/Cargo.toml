[package]
name = "auv-inference-ort"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "ONNX Runtime inference backend for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["runtime"]
# NOTICE: `runtime` links ONNX Runtime through `ort` with the same downloaded
# runtime posture currently used by the existing ORT-backed inference crates.
# Provider passthroughs are compile-time capabilities, not a validated AUV
# support matrix.
runtime = [
  "dep:ort",
  "ort/std",
  "ort/ndarray",
  "ort/download-binaries",
  "ort/tls-native",
  "ort/copy-dylibs",
  "ort/api-24",
]
cpu = ["runtime"]
coreml = ["runtime", "ort/coreml"]
cuda = ["runtime", "ort/cuda"]
directml = ["runtime", "ort/directml"]
openvino = ["runtime", "ort/openvino"]
tensorrt = ["runtime", "ort/tensorrt"]
webgpu = ["runtime", "ort/webgpu"]
xnnpack = ["runtime", "ort/xnnpack"]

[dependencies]
auv-inference-common = { version = "0.0.36", path = "../auv-inference-common" }
ndarray = "0.17"
# NOTICE: `ort` is pinned because Cargo resolves a `2.0.0-rc.N` requirement to
# any later release candidate, and later candidates break the API. rc.14 changed
# `Session::builder()` to take an `&Environment` and allows one Environment per
# process. ultralytics-inference 0.0.18 does not build against rc.15, and
# ultralytics-inference 0.0.54 pins `=2.0.0-rc.14`, keeps its Environment
# private, and needs Rust 1.92. Balatro loads both crates in one process.
# TODO(ort-rc14): upgrade ort and ultralytics-inference together after
# ultralytics-inference can accept a caller-supplied Environment, or after the
# owner approves one shared Environment owner.
ort = { version = "=2.0.0-rc.13", default-features = false, optional = true }
