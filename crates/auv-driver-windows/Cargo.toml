[package]
name = "auv-driver-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Windows driver for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
overlay = ["dep:auv-driver-overlay"]
latency-telemetry = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "auv-latency-benchmark"
path = "src/bin/latency_benchmark.rs"
required-features = ["latency-telemetry"]

[dependencies]
auv-driver-common = { version = "0.0.23", path = "../auv-driver-common" }
auv-driver-overlay = { version = "0.0.23", path = "../auv-driver-overlay", features = ["windows"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "2"
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Ocr",
  "Graphics_Imaging",
  "Security_Cryptography",
  "Globalization",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemServices",
  "Win32_System_Threading"
] }
xcap = "0.6"
