[package]
name = "auv-api-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Transport-aware Rust client for AUV control and capability APIs"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
auv-api-proto = { path = "../auv-api-proto" }
auv-media-macos = { path = "../auv-media-macos" }
auv-driver = { path = "../auv-driver" }
auv-driver-overlay-common = { path = "../auv-driver-overlay-common" }
directories = "6"
fs2.workspace = true
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["net"] }
serde.workspace = true
serde_json.workspace = true
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tower = { version = "0.5", features = ["util"] }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
