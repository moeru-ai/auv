<!doctype html>
<meta charset="utf-8">
<title>AUV keyboard receiver</title>
<style>
  body { font: 16px system-ui; margin: 24px; }
  textarea { width: 90%; height: 160px; font: 20px monospace; }
</style>
<h1>AUV background keyboard receiver</h1>
<p id="case">Waiting for a test case</p>
<textarea autofocus spellcheck="false"></textarea>
<script>
  const input = document.querySelector('textarea');
  document.title = new URL(location).searchParams.get('title');
  let caseId = null;
  let events = [];
  let sequence = 0;
  let polling = false;

  function receipt() {
    return {
      caseId, sequence: ++sequence, value: input.value,
      selection: [input.selectionStart, input.selectionEnd],
      documentFocused: document.hasFocus(),
      inputSelected: document.activeElement === input,
      userAgent: navigator.userAgent, events,
    };
  }
  function send() {
    fetch('/receipt', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(receipt()),
    }).catch(() => {});
  }
  for (const name of ['keydown', 'keyup', 'beforeinput', 'input', 'compositionstart', 'compositionupdate', 'compositionend']) {
    input.addEventListener(name, event => {
      events.push({
        receivedMs: performance.now(),
        type: event.type, key: event.key, code: event.code, data: event.data,
        inputType: event.inputType, shift: event.shiftKey, meta: event.metaKey,
        control: event.ctrlKey, alt: event.altKey, repeat: event.repeat,
        composing: event.isComposing,
        trusted: event.isTrusted, documentFocused: document.hasFocus(),
      });
      send();
    });
  }
  // Fixture setup resets state without synthesizing any keyboard event. The
  // only tested input comes from AUV through the native OS input path.
  setInterval(async () => {
    if (polling) return;
    polling = true;
    try {
      const command = await (await fetch('/command', { cache: 'no-store' })).json();
      if (command.caseId !== caseId) {
        // Finish any prior IME composition before resetting the next case.
        input.blur();
        caseId = command.caseId;
        input.value = command.initial;
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        events = [];
        document.querySelector('#case').textContent = caseId;
        send();
      }
    } finally { polling = false; }
  }, 100);
  input.focus();
  send();
</script>
