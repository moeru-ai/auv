<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Pixel-art pointer on a 12x12 grid of 2px cells; the tip is the top-left cell, so
       the tip lands exactly on the target point. X = edge, I = fill:
       X...........
       XX..........
       XIX.........
       XIIX........
       XIIIX.......
       XIIIIX......
       XIIIIIX.....
       XIIIIIIX....
       XIIIIXXXX...
       XIXIIX......
       XX.XIIX.....
       X..XXXX.....
       {EDGE} and {FILL} are replaced with the variant colors before rasterizing. -->
  <g>
    <rect x="0" y="0" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="2" width="4" height="2" fill="{EDGE}"/>
    <rect x="0" y="4" width="2" height="2" fill="{EDGE}"/>
    <rect x="2" y="4" width="2" height="2" fill="{FILL}"/>
    <rect x="4" y="4" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="6" width="2" height="2" fill="{EDGE}"/>
    <rect x="2" y="6" width="4" height="2" fill="{FILL}"/>
    <rect x="6" y="6" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="8" width="2" height="2" fill="{EDGE}"/>
    <rect x="2" y="8" width="6" height="2" fill="{FILL}"/>
    <rect x="8" y="8" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="10" width="2" height="2" fill="{EDGE}"/>
    <rect x="2" y="10" width="8" height="2" fill="{FILL}"/>
    <rect x="10" y="10" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="12" width="2" height="2" fill="{EDGE}"/>
    <rect x="2" y="12" width="10" height="2" fill="{FILL}"/>
    <rect x="12" y="12" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="14" width="2" height="2" fill="{EDGE}"/>
    <rect x="2" y="14" width="12" height="2" fill="{FILL}"/>
    <rect x="14" y="14" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="16" width="2" height="2" fill="{EDGE}"/>
    <rect x="2" y="16" width="8" height="2" fill="{FILL}"/>
    <rect x="10" y="16" width="8" height="2" fill="{EDGE}"/>
    <rect x="0" y="18" width="2" height="2" fill="{EDGE}"/>
    <rect x="2" y="18" width="2" height="2" fill="{FILL}"/>
    <rect x="4" y="18" width="2" height="2" fill="{EDGE}"/>
    <rect x="6" y="18" width="4" height="2" fill="{FILL}"/>
    <rect x="10" y="18" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="20" width="4" height="2" fill="{EDGE}"/>
    <rect x="6" y="20" width="2" height="2" fill="{EDGE}"/>
    <rect x="8" y="20" width="4" height="2" fill="{FILL}"/>
    <rect x="12" y="20" width="2" height="2" fill="{EDGE}"/>
    <rect x="0" y="22" width="2" height="2" fill="{EDGE}"/>
    <rect x="6" y="22" width="8" height="2" fill="{EDGE}"/>
  </g>
</svg>
