[package]
name = "auv-driver-overlay-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Windows overlay driver for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
auv-driver-common = { version = "0.0.31", path = "../auv-driver-common" }
auv-driver-overlay-common = { version = "0.0.31", path = "../auv-driver-overlay-common" }

[target.'cfg(target_os = "windows")'.dependencies]
# SVG cursor art rasterizer only (wraps usvg); overlay shapes and text are drawn with Direct2D.
resvg = { version = "0.48", default-features = false }
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "Media_Ocr",
  "Graphics_Imaging",
  "Security_Cryptography",
  "Globalization",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader"
] }
