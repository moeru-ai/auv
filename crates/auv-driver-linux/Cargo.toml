[package]
name = "auv-driver-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
autoexamples = false

[features]
default = []
# TODO(driver-overlay-linux): add the Linux adapter after its compositor/session
# ownership is approved; the shared feature exists now so `auv-driver/overlay`
# remains portable without claiming rendered support.
overlay = []

[[example]]
name = "validate"
path = "examples/validate.rs"

[dependencies]
auv-driver-common = { path = "../auv-driver-common" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
fs2 = "0.4"
futures-lite = "2"
leptess = "0.14"
pipewire = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
zbus = "5.15"

[dev-dependencies]
tempfile = "3"
