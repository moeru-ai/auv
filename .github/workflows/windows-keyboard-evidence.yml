name: Windows keyboard recipient evidence

on:
  push:
    branches:
      - codex/windows-keyboard-evidence

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  keyboard-recipient:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4c24a1847d7815dcd0b32564d3c3a6390f74ce65
          persist-credentials: false

      - name: Record exact source and isolated desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($actual -ne '4c24a1847d7815dcd0b32564d3c3a6390f74ce65') { throw "Unexpected source $actual" }
          $directory = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/auv-keyboard-evidence" -Force
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class KeyboardDesktopProbe {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
              [DllImport("user32.dll")]
              public static extern bool CloseDesktop(IntPtr desktop);
              [DllImport("user32.dll")]
              static extern IntPtr SetThreadDpiAwarenessContext(IntPtr context);
              [DllImport("user32.dll")]
              static extern bool AreDpiAwarenessContextsEqual(IntPtr left, IntPtr right);
              [DllImport("user32.dll")]
              static extern IntPtr GetThreadDpiAwarenessContext();
              [DllImport("user32.dll")]
              static extern IntPtr GetWindowDpiAwarenessContext(IntPtr window);
              [DllImport("user32.dll")]
              static extern uint GetDpiForWindow(IntPtr window);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              static extern IntPtr CreateWindowExW(uint extra, string kind, string title, uint style,
                  int x, int y, int width, int height, IntPtr parent, IntPtr menu, IntPtr instance, IntPtr data);
              [DllImport("user32.dll")]
              static extern bool DestroyWindow(IntPtr window);
              public static uint ReadDpi() {
                  var requested = new IntPtr(-4);
                  var previous = SetThreadDpiAwarenessContext(requested);
                  if (previous == IntPtr.Zero) throw new InvalidOperationException("DPI context failed");
                  var window = IntPtr.Zero;
                  try {
                      window = CreateWindowExW(0x08000080, "STATIC", "AUV foreground DPI preflight", 0,
                          0, 0, 1, 1, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero);
                      if (window == IntPtr.Zero || !AreDpiAwarenessContextsEqual(GetWindowDpiAwarenessContext(window), requested))
                          throw new InvalidOperationException("DPI window creation failed");
                      var dpi = GetDpiForWindow(window);
                      if (dpi == 0) throw new InvalidOperationException("DPI query failed");
                      return dpi;
                  } finally {
                      var destroyed = window == IntPtr.Zero || DestroyWindow(window);
                      var restored = SetThreadDpiAwarenessContext(previous) != IntPtr.Zero
                          && AreDpiAwarenessContextsEqual(GetThreadDpiAwarenessContext(), previous);
                      if (!destroyed || !restored) throw new InvalidOperationException("DPI probe cleanup failed");
                  }
              }
          }
          '@
          $desktop = [KeyboardDesktopProbe]::OpenInputDesktop(0, $false, 1)
          $accessible = $desktop -ne [IntPtr]::Zero
          if ($accessible -and -not [KeyboardDesktopProbe]::CloseDesktop($desktop)) { throw 'Desktop handle did not close' }
          $screens = @([System.Windows.Forms.Screen]::AllScreens)
          if (-not [Environment]::UserInteractive -or -not $accessible -or $screens.Count -ne 1) {
            throw 'Stop before native tests: one accessible isolated interactive display is required'
          }
          [ordered]@{
            source_sha = $actual
            base_sha = 'a48e5c4851fda2b87b37749fce421ff6d5c54bf9'
            workflow_sha = '${{ github.sha }}'
            os = [Environment]::OSVersion.VersionString
            image_version = $env:ImageVersion
            session_id = (Get-Process -Id $PID).SessionId
            user_interactive = [Environment]::UserInteractive
            input_desktop_accessible = $accessible
            screens = @($screens | ForEach-Object { $_.Bounds.ToString() })
            primary_window_dpi = [KeyboardDesktopProbe]::ReadDpi()
            expected_baseline_failure = $false
          } | ConvertTo-Json -Depth 4 | Tee-Object -FilePath "$directory/preflight.json"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build probe and owned receivers
        shell: pwsh
        run: |
          cargo build --locked -p auv-base-evals --bin win32-receiver --bin background-session-eval
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p auv-cli --bin auv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaryHashes = [ordered]@{}
          foreach ($binary in @('auv', 'win32-receiver', 'background-session-eval')) {
            $binaryHashes[$binary] = (Get-FileHash -LiteralPath "target/debug/$binary.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $binaryHashes | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/auv-keyboard-evidence/binary-sha256.json"

      - name: Verify hook lifecycle fault models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-keyboard-evidence"
          cargo test --locked -p auv-driver-windows --lib input_recipient::native::tests -- --nocapture 2>&1 | Tee-Object -FilePath "$directory/hooks-models.log"
          if ($LASTEXITCODE -ne 0) { throw 'Hook lifecycle model failed' }
          $modelLog = Get-Content -LiteralPath "$directory/hooks-models.log" -Raw
          if ($modelLog -notmatch 'test result: ok\. 5 passed; 0 failed;') { throw 'Missing five hook lifecycle models' }

      - name: Verify guarded recipient and actual application effects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $directory = "$env:RUNNER_TEMP/auv-keyboard-evidence"
          & target/debug/background-session-eval.exe window-keyboard --output "$directory/records" 2>&1 | Tee-Object -FilePath "$directory/probe.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(Get-Content -LiteralPath "$directory/records/window-keyboard.jsonl" | ForEach-Object { $_ | ConvertFrom-Json })
          $cases = @($rows | Where-Object kind -eq 'case')
          $cleanup = @($rows | Where-Object kind -eq 'cleanup')
          $summary = @($rows | Where-Object kind -eq 'summary')
          $expectedCases = @('legacy_stay', 'bound_success', 'bound_stay', 'bound_aba', 'bound_minimize', 'bound_close',
            'bound_press_success', 'bound_press_stay', 'bound_combo_stay', 'bound_paste_success', 'bound_paste_stay',
            'bound_cancel_after_char', 'bound_pre_cancel', 'bound_activate_once', 'bound_owner_admission')
          if ($cases.Count -ne 15 -or @(Compare-Object $expectedCases @($cases.case)).Count -ne 0 -or
              @($cases | Where-Object { -not $_.passed -or -not $_.modifiers_released -or -not $_.clipboard_text_restored }).Count -ne 0) {
            throw 'Missing complete fifteen-case keyboard application receipts'
          }
          if ($cleanup.Count -ne 30 -or @($cleanup | Where-Object { -not $_.process_exited -or -not $_.window_destroyed }).Count -ne 0) {
            throw 'Owned receiver cleanup did not complete'
          }
          if ($summary.Count -ne 1 -or -not $summary[0].passed -or -not $summary[0].pointer_restored -or -not $summary[0].foreground_restored) {
            throw 'Missing complete desktop restoration receipts'
          }
          if (Test-Path "$directory/probe.log") {
            $log = Get-Content "$directory/probe.log" -Raw
            if ($log.Contains('cleanup failure')) { throw 'Recipient watcher cleanup failed' }
          }
          $summary[0] | ConvertTo-Json -Depth 5 | Tee-Object -FilePath "$directory/result.json"

      - name: Verify real keyboard frontend routing and cancellation
        shell: pwsh
        env:
          AUV_ISOLATED_DESKTOP_EVAL: '1'
          AUV_EVAL_SOURCE_SHA: 4c24a1847d7815dcd0b32564d3c3a6390f74ce65
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $directory = "$env:RUNNER_TEMP/auv-keyboard-evidence"
          $auv = (Resolve-Path 'target/debug/auv.exe').Path
          & target/debug/background-session-eval.exe window-keyboard-routes --auv $auv --output "$directory/route-records" 2>&1 | Tee-Object -FilePath "$directory/routes.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(Get-Content -LiteralPath "$directory/route-records/keyboard-routes.jsonl" | ForEach-Object { $_ | ConvertFrom-Json })
          $cases = @($rows | Where-Object kind -eq 'case')
          $expectedCases = @('rust/success', 'rust/takeover', 'invoke/success', 'invoke/takeover',
            'runner/success', 'runner/takeover', 'mcp-local/success', 'mcp-local/takeover', 'mcp-local/cancel',
            'mcp-runner/success', 'mcp-runner/takeover', 'mcp-runner/cancel')
          $actualCases = @($cases | ForEach-Object { "$($_.route)/$($_.case)" })
          if ($cases.Count -ne 12 -or @(Compare-Object $expectedCases $actualCases).Count -ne 0 -or
              @($cases | Where-Object { -not $_.passed }).Count -ne 0) { throw 'Keyboard frontend application receipts failed' }
          $receiverCleanup = @($rows | Where-Object kind -eq 'receiver_cleanup')
          if ($receiverCleanup.Count -ne 24 -or @($receiverCleanup | Where-Object { -not $_.process_exited -or -not $_.window_destroyed }).Count -ne 0) {
            throw 'Frontend receiver cleanup failed'
          }
          $mcpAdmission = @($rows | Where-Object kind -eq 'mcp_admission')
          $mcpRoutes = @($rows | Where-Object kind -eq 'mcp_route_admission')
          $mcpCleanup = @($rows | Where-Object kind -eq 'mcp_cleanup')
          if ($mcpAdmission.Count -ne 2 -or @($mcpAdmission | Where-Object { -not $_.admitted }).Count -ne 0 -or
              $mcpRoutes.Count -ne 6 -or @($mcpRoutes | Where-Object { -not $_.admitted }).Count -ne 0 -or
              $mcpCleanup.Count -ne 2 -or @($mcpCleanup | Where-Object { -not $_.receipt.process_exited -or $_.receipt.forced_kill }).Count -ne 0) {
            throw 'MCP admission or lifecycle receipts failed'
          }
          $runnerCleanup = @($rows | Where-Object kind -eq 'runner_cleanup')
          if ($runnerCleanup.Count -ne 1 -or -not $runnerCleanup[0].receipt.daemon_exited -or
              $runnerCleanup[0].receipt.run_stop_exit -ne 0 -or $runnerCleanup[0].receipt.owned_tree_kill_exit -ne 0 -or
              $runnerCleanup[0].receipt.fallback_root_kill) { throw 'Owned Runner cleanup failed' }
          $summary = @($rows | Where-Object kind -eq 'summary')
          if ($summary.Count -ne 1 -or -not $summary[0].passed -or -not $summary[0].pointer_restored -or
              -not $summary[0].foreground_restored -or $summary[0].physical_keys -ne 0 -or $summary[0].physical_mouse -ne 0) {
            throw 'Frontend desktop restoration failed'
          }
          $pictures = @(Get-ChildItem -LiteralPath "$directory/route-records" -Recurse -File -Filter '*-after.png')
          if ($pictures.Count -ne 24) { throw 'Missing owned-window visual evidence' }
          $summary[0] | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$directory/routes-result.json"

      - name: Preserve preflight and exact regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-keyboard-routes-4c24a184
          path: ${{ runner.temp }}/auv-keyboard-evidence/
          if-no-files-found: error
          retention-days: 14
