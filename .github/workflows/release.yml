name: Release

on:
  release:
    types:
      - prereleased
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: Upload artifacts to an existing GitHub release
        required: false
        default: false
        type: boolean
      tag_name:
        description: Existing release tag to upload to when upload_to_release is enabled
        required: false
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: auv
  CARGO_TERM_COLOR: always
  # NOTICE: Big Sur aligns both architectures on the system Swift runtime;
  # Rust's older x86_64 default otherwise produces an unresolved @rpath load.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  PACKAGE_NAME: auv-cli

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: auv-x86_64-unknown-linux-gnu.tar.gz
            binding: auv-binding.linux-x64-gnu.node
            executable: auv
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: auv-aarch64-unknown-linux-gnu.tar.gz
            binding: auv-binding.linux-arm64-gnu.node
            executable: auv
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: auv-x86_64-apple-darwin.tar.gz
            binding: auv-binding.darwin-x64.node
            executable: auv
          - os: macos-14
            target: aarch64-apple-darwin
            archive: auv-aarch64-apple-darwin.tar.gz
            binding: auv-binding.darwin-arm64.node
            executable: auv
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: auv-x86_64-pc-windows-msvc.zip
            binding: auv-binding.win32-x64-msvc.node
            executable: auv.exe

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libleptonica-dev \
            libtesseract-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NAPI binding
        working-directory: js/packages/cli
        run: pnpm build --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --package "${{ env.PACKAGE_NAME }}" --bin "${{ env.BINARY_NAME }}" --target "${{ matrix.target }}"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}

      - name: Sign macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          test -n "$identity"
          codesign --force --timestamp --options runtime \
            --sign "$identity" \
            "target/${{ matrix.target }}/release/${{ matrix.executable }}"
          codesign --verify --strict --verbose=2 "target/${{ matrix.target }}/release/${{ matrix.executable }}"

      - name: Verify binary starts
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --help

      - name: Create archive
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.executable }}

      - name: Create archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" -DestinationPath "${{ matrix.archive }}"

      - name: Calculate hash
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.archive }} | awk '{ print $1 }' > ${{ matrix.archive }}.sha256

      - name: Calculate hash
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-Content -Path "${{ matrix.archive }}.sha256" -Value (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            js/packages/cli/${{ matrix.binding }}

  publish:
    name: Publish release artifacts
    needs:
      - build
      - notarize-macos
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release && inputs.tag_name != '')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prefer notarized macOS archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print0 | while IFS= read -r -d '' file; do
            case "$file" in
              artifacts/notarized-*/*)
                cp "$file" release/
                ;;
              *apple-darwin*)
                if [ ! -e "release/$(basename "$file")" ]; then
                  cp "$file" release/
                fi
                ;;
              *)
                cp "$file" release/
                ;;
            esac
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*

  notarize-macos:
    name: Notarize macOS ${{ matrix.archive }}
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release && inputs.tag_name != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive: auv-x86_64-apple-darwin.tar.gz
          - archive: auv-aarch64-apple-darwin.tar.gz

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.archive }}

      - name: Set up notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          xcrun notarytool store-credentials auv-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Submit executable for notarization
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf ${{ matrix.archive }}
          codesign --verify --strict --verbose=2 auv
          zip auv-notary.zip auv
          xcrun notarytool submit auv-notary.zip --keychain-profile auv-notary --wait
          ./auv --help
          tar -czf ${{ matrix.archive }} auv
          shasum -a 256 ${{ matrix.archive }} | awk '{ print $1 }' > ${{ matrix.archive }}.sha256

      - name: Upload notarized macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: notarized-${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  publish-npm-cli:
    name: Publish NAPI and CLI npm packages
    needs: publish
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: js/packages/cli/artifacts

      - name: Assemble platform npm packages
        working-directory: js/packages/cli
        env:
          AUV_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm artifacts

      - name: Verify npm package contents
        working-directory: js/packages/cli
        run: |
          pnpm run build:js
          pnpm exec napi prepublish -t npm --no-gh-release --dry-run
          mkdir -p npm-package
          pnpm pack --pack-destination npm-package
          npm publish ./npm-package/*.tgz --access public --dry-run

      - name: Publish npm packages
        working-directory: js/packages/cli
        # NOTICE(release-asset-owner): The publish job owns GitHub Release
        # assets; NAPI prepublish only prepares and publishes npm packages.
        run: |
          pnpm prepublishOnly
          pnpm pack --pack-destination npm-package
          npm publish ./npm-package/*.tgz --access public
