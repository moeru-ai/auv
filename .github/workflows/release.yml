name: Release

on:
  release:
    types:
      - prereleased
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: Upload artifacts to an existing GitHub release
        required: false
        default: false
        type: boolean
      tag_name:
        description: Existing release tag to upload to when upload_to_release is enabled
        required: false
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: auv
  CARGO_TERM_COLOR: always
  # NOTICE: Big Sur aligns both architectures on the system Swift runtime;
  # Rust's older x86_64 default otherwise produces an unresolved @rpath load.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  PACKAGE_NAME: auv-cli

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: auv-x86_64-unknown-linux-gnu.tar.gz
            binding: auv-binding.linux-x64-gnu.node
            executable: auv
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: auv-aarch64-unknown-linux-gnu.tar.gz
            binding: auv-binding.linux-arm64-gnu.node
            executable: auv
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: auv-x86_64-apple-darwin.tar.gz
            binding: auv-binding.darwin-x64.node
            executable: auv
          # NOTICE(helper-icon-xcode): The helper's Icon Composer icon needs
          # Xcode 26. macos-14 cannot run it, and on macos-15-arm64
          # (macOS 15.7.9) Xcode 26.3's ibtoold crashes on a missing
          # MediaToolbox symbol. macos-26 ships Xcode 26.6 on macOS 26.
          - os: macos-26
            target: aarch64-apple-darwin
            archive: auv-aarch64-apple-darwin.tar.gz
            binding: auv-binding.darwin-arm64.node
            executable: auv
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: auv-x86_64-pc-windows-msvc.zip
            binding: auv-binding.win32-x64-msvc.node
            executable: auv.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: auv-aarch64-pc-windows-msvc.zip
            binding: auv-binding.win32-arm64-msvc.node
            executable: auv.exe

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libleptonica-dev \
            libtesseract-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Import macOS signing certificates
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}

      - name: Build and notarize embedded macOS helper app
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          application_identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          test -n "$application_identity"
          output="target/embedded-helper-${{ matrix.target }}"
          notarization_archive="target/AUV-Helper-notarization-${{ matrix.target }}.zip"
          embedded_archive="target/AUV-Helper-${{ matrix.target }}.zip"
          # NOTICE(helper-icon-xcode): macos-15 images install Xcode 26 but
          # default to Xcode 16, whose actool silently ignores `.icon` input.
          # Select the newest Xcode 26 only for the helper package build.
          helper_xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          test -n "$helper_xcode" || { echo 'no Xcode 26 found for the AUV Helper icon' >&2; exit 1; }
          DEVELOPER_DIR="$helper_xcode/Contents/Developer" \
            AUV_MACOS_TARGET='${{ matrix.target }}' \
            AUV_MACOS_SIGN_IDENTITY="$application_identity" \
            crates/auv-device-helper-macos/package/package.sh "$output"
          ditto -c -k --keepParent "$output/AUV Helper.app" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$output/AUV Helper.app"
          spctl --assess --type execute --verbose=2 "$output/AUV Helper.app"
          ditto -c -k --keepParent "$output/AUV Helper.app" "$embedded_archive"
          echo "AUV_MACOS_HELPER_APP_ARCHIVE_PATH=$PWD/$embedded_archive" >> "$GITHUB_ENV"

      - name: Build NAPI binding
        working-directory: js/packages/cli
        # The multi-line command uses POSIX line continuations.
        shell: bash
        run: |
          pnpm build:js
          pnpm exec napi build --platform --release --esm --js binding.js --dts binding.d.ts \
            --target '${{ matrix.target }}' -- --locked

      - name: Build Windows helper
        if: runner.os == 'Windows'
        # TODO(windows-release-signing): Authenticode-sign both Windows
        # executables after a release certificate and provenance policy are
        # owner-approved; archive packaging alone is not a signing claim.
        shell: pwsh
        run: |
          cargo build --locked --release --package auv-device-helper-windows --bin auv-helper --target "${{ matrix.target }}"
          $helper = (Resolve-Path "target/${{ matrix.target }}/release/auv-helper.exe").Path
          "AUV_WINDOWS_HELPER_EXE_PATH=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        run: cargo build --locked --release --package "${{ env.PACKAGE_NAME }}" --bin "${{ env.BINARY_NAME }}" --target "${{ matrix.target }}"

      - name: Sign macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          test -n "$identity"
          codesign --force --timestamp --options runtime \
            --sign "$identity" \
            "target/${{ matrix.target }}/release/${{ matrix.executable }}"
          codesign --verify --strict --verbose=2 "target/${{ matrix.target }}/release/${{ matrix.executable }}"

      - name: Verify binary starts
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --help

      - name: Verify Windows helper rejects direct invocation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "target/${{ matrix.target }}/release/auv-helper.exe" -Wait -PassThru
          if ($process.ExitCode -ne 2) {
            throw "auv-helper.exe returned $($process.ExitCode) instead of rejecting direct invocation with exit code 2"
          }

      - name: Create archive
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.executable }}

      - name: Create archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" -DestinationPath "${{ matrix.archive }}"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "${{ matrix.archive }}"))
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $expected = @("${{ matrix.executable }}")
          if (Compare-Object $expected $entries) {
            throw "Windows release archive does not contain exactly auv.exe"
          }

      - name: Calculate hash
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.archive }} | awk '{ print $1 }' > ${{ matrix.archive }}.sha256

      - name: Calculate hash
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-Content -Path "${{ matrix.archive }}.sha256" -Value (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            js/packages/cli/${{ matrix.binding }}

  publish:
    name: Publish release artifacts
    needs:
      - build
      - notarize-macos
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release && inputs.tag_name != '')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prefer notarized macOS archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print0 | while IFS= read -r -d '' file; do
            case "$file" in
              artifacts/notarized-*/*)
                cp "$file" release/
                ;;
              *apple-darwin*)
                if [ ! -e "release/$(basename "$file")" ]; then
                  cp "$file" release/
                fi
                ;;
              *)
                cp "$file" release/
                ;;
            esac
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*

  notarize-macos:
    name: Notarize macOS ${{ matrix.archive }}
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release && inputs.tag_name != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive: auv-x86_64-apple-darwin.tar.gz
          - archive: auv-aarch64-apple-darwin.tar.gz

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.archive }}

      - name: Set up notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          xcrun notarytool store-credentials auv-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Submit executable for notarization
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf ${{ matrix.archive }}
          codesign --verify --strict --verbose=2 auv
          zip auv-notary.zip auv
          xcrun notarytool submit auv-notary.zip --keychain-profile auv-notary --wait
          ./auv --help
          tar -czf ${{ matrix.archive }} auv
          shasum -a 256 ${{ matrix.archive }} | awk '{ print $1 }' > ${{ matrix.archive }}.sha256

      - name: Upload notarized macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: notarized-${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  # NOTICE: NAPI and CLI npm packages need the binaries built for a GitHub
  # Release, so they remain on this event instead of the registry tag workflow.
  publish-npm-cli:
    name: Publish NAPI and CLI npm packages
    needs: publish
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: js/packages/cli/artifacts

      - name: Assemble platform npm packages
        working-directory: js/packages/cli
        env:
          AUV_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm artifacts

      - name: Verify npm package contents
        working-directory: js/packages/cli
        run: |
          pnpm run build:js
          pnpm exec napi prepublish -t npm --no-gh-release --dry-run
          mkdir -p npm-package
          pnpm pack --pack-destination npm-package
          npm publish ./npm-package/*.tgz --access public --dry-run

      - name: Publish npm packages
        working-directory: js/packages/cli
        # NOTICE(release-asset-owner): The publish job owns GitHub Release
        # assets; NAPI prepublish only prepares and publishes npm packages.
        run: |
          pnpm prepublishOnly
          pnpm pack --pack-destination npm-package
          npm publish ./npm-package/*.tgz --access public
