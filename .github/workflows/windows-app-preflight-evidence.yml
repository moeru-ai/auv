name: Windows app environment evidence

on:
  push:
    branches:
      - codex/windows-app-preflight

permissions:
  contents: read

jobs:
  inventory:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bea0c29474b6c8c44aa0401636ee83efe8b23312
          persist-credentials: false

      - name: Inspect the isolated desktop and installed application tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class AppEnvironmentProbe {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
              [DllImport("user32.dll", SetLastError = true)]
              public static extern bool CloseDesktop(IntPtr desktop);
              [DllImport("user32.dll", SetLastError = true)]
              static extern IntPtr SetThreadDpiAwarenessContext(IntPtr context);
              [DllImport("user32.dll")]
              static extern IntPtr GetThreadDpiAwarenessContext();
              [DllImport("user32.dll")]
              static extern IntPtr GetWindowDpiAwarenessContext(IntPtr window);
              [DllImport("user32.dll")]
              static extern bool AreDpiAwarenessContextsEqual(IntPtr left, IntPtr right);
              [DllImport("user32.dll")]
              static extern uint GetDpiForWindow(IntPtr window);
              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern IntPtr CreateWindowExW(uint extra, string kind, string title, uint style,
                  int x, int y, int width, int height, IntPtr parent, IntPtr menu, IntPtr instance, IntPtr data);
              [DllImport("user32.dll", SetLastError = true)]
              static extern bool DestroyWindow(IntPtr window);

              public static uint ReadPrimaryWindowDpi() {
                  // SDK DPI_AWARENESS_CONTEXT_PER_MONITOR_AWARE_V2. Only this
                  // thread changes context; no system scale or registry is set.
                  var perMonitor = new IntPtr(-4);
                  var previous = SetThreadDpiAwarenessContext(perMonitor);
                  if (previous == IntPtr.Zero) throw new Win32Exception();
                  var window = IntPtr.Zero;
                  try {
                      // Standard STATIC class, hidden and non-activating, on
                      // the primary monitor. It cannot receive workflow input.
                      window = CreateWindowExW(0x08000080, "STATIC", "AUV DPI preflight", 0,
                          0, 0, 1, 1, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero);
                      if (window == IntPtr.Zero) throw new Win32Exception();
                      if (!AreDpiAwarenessContextsEqual(GetWindowDpiAwarenessContext(window), perMonitor))
                          throw new InvalidOperationException("DPI probe window is not per-monitor aware v2");
                      var dpi = GetDpiForWindow(window);
                      if (dpi == 0) throw new InvalidOperationException("GetDpiForWindow returned zero");
                      return dpi;
                  }
                  finally {
                      var destroyed = window == IntPtr.Zero || DestroyWindow(window);
                      var restored = SetThreadDpiAwarenessContext(previous) != IntPtr.Zero
                          && AreDpiAwarenessContextsEqual(GetThreadDpiAwarenessContext(), previous);
                      if (!destroyed || !restored)
                          throw new InvalidOperationException("DPI probe cleanup or thread-context restoration failed");
                  }
              }
          }
          '@
          $source = git rev-parse HEAD
          if ($source -ne 'bea0c29474b6c8c44aa0401636ee83efe8b23312') { throw "Unexpected source $source" }
          $desktop = [AppEnvironmentProbe]::OpenInputDesktop(0, $false, 1)
          $accessible = $desktop -ne [IntPtr]::Zero
          if ($accessible -and -not [AppEnvironmentProbe]::CloseDesktop($desktop)) { throw 'Input-desktop probe handle did not close' }
          $screens = @([System.Windows.Forms.Screen]::AllScreens)
          if (-not [Environment]::UserInteractive -or -not $accessible -or $screens.Count -ne 1) {
            throw 'Later app tests need one accessible isolated interactive display'
          }
          $dpi = [AppEnvironmentProbe]::ReadPrimaryWindowDpi()
          $programFiles = [Environment]::GetFolderPath('ProgramFiles')
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = [ordered]@{
            edge = @((Join-Path $programFilesX86 'Microsoft/Edge/Application/msedge.exe'), (Join-Path $programFiles 'Microsoft/Edge/Application/msedge.exe'))
            vscode = @((Join-Path $programFiles 'Microsoft VS Code/Code.exe'), (Join-Path $env:LOCALAPPDATA 'Programs/Microsoft VS Code/Code.exe'))
            vlc = @((Join-Path $programFiles 'VideoLAN/VLC/vlc.exe'))
            qbittorrent = @((Join-Path $programFiles 'qBittorrent/qbittorrent.exe'))
            ilspy = @((Join-Path $programFiles 'ILSpy/ILSpy.exe'))
            powershell_ise = @((Join-Path ([Environment]::GetFolderPath('System')) 'WindowsPowerShell/v1.0/PowerShell_ISE.exe'))
          }
          $applications = [ordered]@{}
          foreach ($name in $candidates.Keys) {
            $path = @($candidates[$name] | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
            if ($path.Count -eq 0) { $applications[$name] = @{ present = $false }; continue }
            $file = Get-Item -LiteralPath $path[0]
            $applications[$name] = @{
              present = $true
              path = $file.FullName
              file_version = $file.VersionInfo.FileVersion
              product_version = $file.VersionInfo.ProductVersion
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $commands = [ordered]@{}
          foreach ($name in @('dotnet', 'node', 'code', 'choco', 'winget', 'rustc', 'cargo')) {
            $command = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            $commands[$name] = if ($command) { @{ present = $true; source = $command.Source } } else { @{ present = $false } }
          }
          $runtimes = @()
          $sdks = @()
          if ($commands.dotnet.present) {
            $env:DOTNET_NOLOGO = '1'
            $env:DOTNET_SKIP_FIRST_TIME_EXPERIENCE = '1'
            $runtimes = @(& $commands.dotnet.source --list-runtimes)
            if ($LASTEXITCODE -ne 0) { throw 'dotnet runtime inventory failed' }
            $sdks = @(& $commands.dotnet.source --list-sdks)
            if ($LASTEXITCODE -ne 0) { throw 'dotnet SDK inventory failed' }
          }
          $facts = [ordered]@{
            evidence_level = 'environment_preflight_only'
            source_sha = $source
            workflow_sha = '${{ github.sha }}'
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            os = [Environment]::OSVersion.VersionString
            session_id = (Get-Process -Id $PID).SessionId
            user_interactive = [Environment]::UserInteractive
            input_desktop_accessible = $accessible
            screens_reported_to_powershell = @($screens | ForEach-Object { $_.Bounds.ToString() })
            primary_window_dpi = $dpi
            primary_effective_scale_percent = 100.0 * $dpi / 96
            dpi_method = 'GetDpiForWindow on an owned hidden PMv2 window; window destroyed and thread context restored'
            applications = $applications
            commands = $commands
            dotnet_runtimes = $runtimes
            dotnet_sdks = $sdks
          }
          $output = Join-Path $env:RUNNER_TEMP 'auv-app-preflight'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $facts | ConvertTo-Json -Depth 8 | Tee-Object -FilePath (Join-Path $output 'environment.json')

      - name: Prepare pinned portable application packages without launching them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'auv-portable-apps'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          $packages = @(
            @{ id='notepadnext'; version='0.15'; exe='NotepadNext.exe'; toolkit='Qt';
              url='https://github.com/dail8859/NotepadNext/releases/download/v0.15/NotepadNext-v0.15-win64.zip';
              sha256='148aa88d706bb67a7c1f3727953ed686204be52876336971634b0223e6ed2148' },
            @{ id='vscode'; version='1.144.0'; exe='Code.exe'; toolkit='Electron';
              url='https://vscode.download.prss.microsoft.com/dbazure/download/stable/2c33b50b16c472efe58357d1d2a8a5414bc23fbf/VSCode-win32-x64-1.144.0.zip';
              sha256='055722269e3c9531af0c50a8b757c14e8062a0d02fc973b038863d9732c567ea' }
          )
          $packageFacts = @()
          foreach ($package in $packages) {
            $archivePath = Join-Path $packageRoot ($package.id + '.zip')
            $extractPath = Join-Path $packageRoot $package.id
            Invoke-WebRequest -Uri $package.url -OutFile $archivePath
            $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($archiveHash -ne $package.sha256) { throw "Package digest mismatch: $($package.id)" }
            Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath
            $executables = @(Get-ChildItem -LiteralPath $extractPath -Recurse -File -Filter $package.exe)
            if ($executables.Count -ne 1) { throw "Expected one package executable: $($package.id)" }
            $executable = $executables[0]
            $qtCore = @(Get-ChildItem -LiteralPath $extractPath -Recurse -File -Filter 'Qt6Core.dll')
            $qtVersion = if ($qtCore.Count -eq 1) { $qtCore[0].VersionInfo.ProductVersion } else { $null }
            if ($package.id -eq 'notepadnext' -and $qtCore.Count -ne 1) { throw 'Expected one bundled Qt 6 runtime' }
            $packageFacts += [ordered]@{
              id=$package.id; version=$package.version; toolkit=$package.toolkit;
              url=$package.url; archive_sha256=$archiveHash; digest_verified=$true;
              executable=$executable.FullName; file_version=$executable.VersionInfo.FileVersion;
              executable_sha256=(Get-FileHash -LiteralPath $executable.FullName -Algorithm SHA256).Hash.ToLowerInvariant();
              bundled_qt_version=$qtVersion; launched=$false
            }
          }
          [ordered]@{ workflow_sha='${{ github.sha }}'; preflight_only=$true; packages=$packageFacts } |
            ConvertTo-Json -Depth 7 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'auv-app-preflight/portable-apps.json')

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the application controls evaluator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          cargo build --locked -p auv-base-evals --bin background-session-eval
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Get-Item -LiteralPath 'target/debug/background-session-eval.exe'
          @{ path=$binary.FullName; sha256=(Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/auv-app-preflight/evaluator-binary.json"

      - name: Launch and inspect owned real applications
        shell: pwsh
        env:
          AUV_ISOLATED_DESKTOP_EVAL: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-app-preflight"
          $environmentFacts = Get-Content -LiteralPath "$directory/environment.json" -Raw | ConvertFrom-Json
          $portable = Get-Content -LiteralPath "$directory/portable-apps.json" -Raw | ConvertFrom-Json
          $code = @($portable.packages | Where-Object id -eq 'vscode')[0].executable
          $notepadnext = @($portable.packages | Where-Object id -eq 'notepadnext')[0].executable
          & 'target/debug/background-session-eval.exe' app-controls --output "$directory/controls" `
            --edge $environmentFacts.applications.edge.path --vscode $code --notepadnext $notepadnext `
            --powershell-ise $environmentFacts.applications.powershell_ise.path `
            > "$directory/controls.stdout.log" 2> "$directory/controls.stderr.log"
          $evaluationExit = $LASTEXITCODE
          $rows = @(Get-Content -LiteralPath "$directory/controls/application-controls.jsonl" | ForEach-Object { $_ | ConvertFrom-Json -Depth 70 })
          $apps = @($rows | Where-Object kind -eq 'app')
          if ($apps.Count -ne 4 -or @($apps | Where-Object { $_.cleanup.active_processes -ne 0 -or -not $_.cleanup.roots_exited }).Count -ne 0) {
            throw 'Owned application cleanup records are incomplete'
          }
          $summary = @($rows | Where-Object kind -eq 'summary')[0]
          if ($summary.workflow_accepted -ne $false) { throw 'Inventory must not accept a functional workflow' }
          $summary | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$directory/controls-result.json"
          if ($evaluationExit -ne 0 -or -not $summary.inventory_complete) { throw 'Application controls inventory incomplete; inspect retained errors' }

      - name: Preserve the environment inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-controls-bea0c294
          path: |
            ${{ runner.temp }}/auv-app-preflight/
            !${{ runner.temp }}/auv-app-preflight/controls/**/profile/**
            !${{ runner.temp }}/auv-app-preflight/controls/**/extensions/**
          if-no-files-found: warn
          retention-days: 14
