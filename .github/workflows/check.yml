name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A newer push to the same pull request supersedes the older run. Runs on
  # main are never cancelled, so every main commit keeps a complete result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tooling:
    name: release tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: scripts/tests/render-homebrew-formula

  proto-naming:
    name: proto method naming
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # The config enables only method-naming rules; see proto/api-linter.yaml.
      - working-directory: proto
        run: |
          go run github.com/googleapis/api-linter/v2/cmd/api-linter@v2.4.1 \
            --config api-linter.yaml -I . -I vendor --set-exit-status --output-format github \
            $(find auv -name '*.proto' | sort)

  python:
    name: python checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          locked: true
      # Ruff format check, Ruff lint, and ty against the locked environment.
      - run: pixi run --locked check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    name: rust checks ${{ matrix.os }}
    env:
      # NOTICE(ci-disk): since the Rust cache (#467) restores `target/` before
      # a full workspace test build, the Ubuntu runner ran out of disk ("No
      # space left on device"). Line tables keep file:line in panics and
      # backtraces but shrink debug info, the bulk of `target/`.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # NOTICE(ci-disk): the hosted Ubuntu image ships toolchains this job
      # never uses; removing them frees about 20 GB for the build and cache.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libleptonica-dev \
            libtesseract-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Pull requests only restore the cache; main writes it, so a pull
      # request cannot evict main's entry or poison it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      # Regression: compile the Git checkout before any proto dependency export.
      # Generating vendor here previously hid missing files from cargo install --git.
      - run: cargo check
      - name: Build Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --package auv-device-helper-windows --bin auv-helper
          $helper = (Resolve-Path "target/debug/auv-helper.exe").Path
          $env:AUV_WINDOWS_HELPER_EXE_PATH = $helper
          "AUV_WINDOWS_HELPER_EXE_PATH=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cargo build --locked --package auv-cli --bin auv
      # Every workspace member, not only the `auv-cli` default member. Tests
      # that drive real input or desktops are `#[ignore]`d and run explicitly.
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo run --quiet -- invoke --help
      - run: git diff --check

  # Packages and verifies every publishable crate the way the release does, so
  # a crate that reads files outside its package fails here instead of at
  # release time. 0.0.32 through 0.0.40 never reached crates.io because
  # `auv-cli` `include_str!`ed docs outside the crate (#456).
  crate-packages:
    name: crates.io package verification
    # Same runner as "Publish crates.io packages" in release-npm-package.yml.
    # The release runs scripts/publish-crates, which publishes the crates
    # missing from crates.io; this checks all of them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # Pull requests only restore the cache; main writes it, so a pull
      # request cannot evict main's entry or poison it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo publish --workspace --locked --dry-run

  proto-vendor:
    name: verify vendored Protobuf ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          version: "1.71.0"
          setup_only: true
      - name: Install yq
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install yq --version 4.53.3 --yes --no-progress
      - name: Regenerate vendored Protobuf dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/generate-proto-vendor.ps1
      - name: Regenerate vendored Protobuf dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/generate-proto-vendor
      - name: Verify checked-in dependencies match buf.lock
        shell: bash
        run: |
          # Include untracked files: a new export must be committed too.
          changes=$(git status --porcelain --untracked-files=all -- proto/vendor)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Run scripts/generate-proto-vendor."
            exit 1
          fi
