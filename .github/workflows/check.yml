name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
    runs-on: ${{ matrix.os }}
    name: rust checks ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libleptonica-dev \
            libtesseract-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo test
      - run: cargo run --quiet -- invoke --help
      # `swift test` builds every target in the package, including
      # `AuvMacosNative`, whose bridging header lives under the gitignored
      # `Generated/`. Generate it before the Swift tests run.
      - name: Generate Swift bridge sources
        if: runner.os == 'macOS'
        run: bash scripts/generate-swift-bridge
      # Covers the AX observed-path parse contract (root marker, non-negative
      # integer segments, offset reporting, per-operation verb interpolation)
      # via the pure `AuvAxPath` target. No Accessibility grant needed.
      - name: Swift tests (AX path parse contract)
        if: runner.os == 'macOS'
        working-directory: crates/auv-driver-macos/native/swift
        run: swift test
      - run: git diff --check
