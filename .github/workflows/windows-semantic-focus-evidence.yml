name: Windows semantic focus evidence

on:
  push:
    branches:
      - codex/windows-semantic-focus-evidence

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  desktop-verification:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2d30101922551769eff9ecec2bfa23934dbe20d0
          submodules: recursive
          persist-credentials: false

      - name: Record source and isolated desktop preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($actual -ne '2d30101922551769eff9ecec2bfa23934dbe20d0') { throw "Unexpected source: $actual" }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/auv-focus-preflight" -Force | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class FocusDesktopProbe {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
              [DllImport("user32.dll")]
              public static extern bool CloseDesktop(IntPtr desktop);
          }
          '@
          $desktop = [FocusDesktopProbe]::OpenInputDesktop(0, $false, 1)
          $screens = [System.Windows.Forms.Screen]::AllScreens
          $facts = [ordered]@{
            source_sha = $actual
            integration_base = '5b722b027c5270074b11c0296134c29584060f4e'
            os = [Environment]::OSVersion.VersionString
            session_id = (Get-Process -Id $PID).SessionId
            user_interactive = [Environment]::UserInteractive
            input_desktop_open = ($desktop -ne [IntPtr]::Zero)
            screens = @($screens | ForEach-Object { $_.Bounds.ToString() })
          }
          $facts | ConvertTo-Json -Depth 4 | Tee-Object -FilePath "$env:RUNNER_TEMP/auv-focus-preflight/desktop.json"
          Get-Process | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object ProcessName, Id, MainWindowTitle | Format-Table -AutoSize
          if ($desktop -ne [IntPtr]::Zero) { [void][FocusDesktopProbe]::CloseDesktop($desktop) }
          if (-not $facts.user_interactive -or -not $facts.input_desktop_open -or $screens.Count -ne 1) {
            throw 'This evidence run needs one accessible isolated interactive display. Stop before GUI tests.'
          }

      - uses: dtolnay/rust-toolchain@stable

      - name: Build helper and source binaries
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --package auv-device-helper-windows --bin auv-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AUV_WINDOWS_HELPER_EXE_PATH = (Resolve-Path 'target/debug/auv-helper.exe').Path
          "AUV_WINDOWS_HELPER_EXE_PATH=$env:AUV_WINDOWS_HELPER_EXE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cargo build --locked --package auv-cli --bin auv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --package auv-base-evals --bin win32-receiver --bin background-session-eval
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The PR's standard Check workflow owns the full workspace suite. Keep
      # native acceptance independent of that duplicate long-running build.
      - name: Run affected contract and no-desktop regression tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          cargo test --locked -p auv-api-proto -p auv-core -p auv-cli-invoke -p auv-cli --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p auv-driver-windows --lib accessibility:: -- --skip snapshot_window_captures_root_node_for_a_live_window
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p auv-base-evals --lib desktop_windows::foreground_commands::workflow::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --quiet -- invoke --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise all three original workflow routes twice
        shell: pwsh
        run: |
          & target/debug/background-session-eval.exe workflow --output "$env:RUNNER_TEMP/auv-focus-baseline" --auv target/debug/auv.exe --rounds 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise all three semantic focus routes twice
        shell: pwsh
        run: |
          & target/debug/background-session-eval.exe workflow --output "$env:RUNNER_TEMP/auv-focus-semantic" --auv target/debug/auv.exe --rounds 2 --semantic-focus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify complete workflows and independent focus receipts
        shell: pwsh
        run: |
          foreach ($mode in @('baseline', 'semantic')) {
            $records = @(Get-ChildItem -Path "$env:RUNNER_TEMP/auv-focus-$mode" -Filter workflow.jsonl -Recurse)
            if ($records.Count -ne 6) { throw "$mode expected six records, got $($records.Count)" }
            foreach ($record in $records) {
              $rows = @(Get-Content -LiteralPath $record.FullName | ForEach-Object { $_ | ConvertFrom-Json })
              $summaries = @($rows | Where-Object { $_.kind -eq 'summary' })
              if ($summaries.Count -ne 1) { throw "Missing unique summary in $($record.FullName)" }
              $summary = $summaries[0]
              if ($summary.passed -ne $true -or $summary.user_interrupted -ne $false) { throw "Failed workflow in $($record.FullName)" }
              if ($summary.quiet_inconclusive -ne 0 -or $summary.quiet_violated -ne 0 -or $summary.input_action_retries -ne 0) { throw "Unsafe workflow in $($record.FullName)" }
              if ($mode -eq 'semantic') {
                $refusals = @($rows | Where-Object { $_.kind -eq 'missing_focus_query' })
                $focus = @($rows | Where-Object { $_.kind -eq 'semantic_focus_verification' })
                if ($refusals.Count -ne 1 -or $refusals[0].verified -ne $true -or $refusals[0].failure_code -ne 'not_found') { throw "Missing refusal proof in $($record.FullName)" }
                if ($focus.Count -ne 1 -or $focus[0].verified -ne $true -or $focus[0].receiver_focused -ne $true) { throw "Missing application focus proof in $($record.FullName)" }
              }
              $summary | ConvertTo-Json -Depth 5 -Compress
            }
          }

      - name: Print available outcomes
        if: always()
        shell: pwsh
        run: |
          foreach ($mode in @('baseline', 'semantic')) {
            $directory = "$env:RUNNER_TEMP/auv-focus-$mode"
            if (Test-Path -LiteralPath $directory) {
              Get-ChildItem -LiteralPath $directory -Filter workflow.jsonl -Recurse | Sort-Object FullName | ForEach-Object {
                Write-Host $_.FullName
                Get-Content -LiteralPath $_.FullName -Tail 3
              }
            }
          }

      - name: Preserve source, preflight, and application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-semantic-focus-2d301019
          path: |
            ${{ runner.temp }}/auv-focus-preflight/
            ${{ runner.temp }}/auv-focus-baseline/
            ${{ runner.temp }}/auv-focus-semantic/
          if-no-files-found: warn
          retention-days: 14
