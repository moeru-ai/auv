name: Windows semantic focus evidence

on:
  push:
    branches:
      - codex/windows-semantic-focus-evidence

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  desktop-verification:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 58938f515bbd35a77d9f555e0c3c7c12e3ccabc3
          submodules: recursive
          persist-credentials: false

      - name: Record source and isolated desktop preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($actual -ne '58938f515bbd35a77d9f555e0c3c7c12e3ccabc3') { throw "Unexpected source: $actual" }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/auv-focus-preflight" -Force | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class FocusDesktopProbe {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
              [DllImport("user32.dll")]
              public static extern bool CloseDesktop(IntPtr desktop);
          }
          '@
          $desktop = [FocusDesktopProbe]::OpenInputDesktop(0, $false, 1)
          $screens = [System.Windows.Forms.Screen]::AllScreens
          $facts = [ordered]@{
            source_sha = $actual
            integration_base = '4a3ec71c22f673b9470d21e61cd3e82e9e4fd91f'
            os = [Environment]::OSVersion.VersionString
            session_id = (Get-Process -Id $PID).SessionId
            user_interactive = [Environment]::UserInteractive
            input_desktop_open = ($desktop -ne [IntPtr]::Zero)
            screens = @($screens | ForEach-Object { $_.Bounds.ToString() })
          }
          $facts | ConvertTo-Json -Depth 4 | Tee-Object -FilePath "$env:RUNNER_TEMP/auv-focus-preflight/desktop.json"
          Get-Process | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object ProcessName, Id, MainWindowTitle | Format-Table -AutoSize
          if ($desktop -ne [IntPtr]::Zero) { [void][FocusDesktopProbe]::CloseDesktop($desktop) }
          if (-not $facts.user_interactive -or -not $facts.input_desktop_open -or $screens.Count -ne 1) {
            throw 'This evidence run needs one accessible isolated interactive display. Stop before GUI tests.'
          }

      - uses: dtolnay/rust-toolchain@stable

      - name: Build helper and source binaries
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --package auv-device-helper-windows --bin auv-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AUV_WINDOWS_HELPER_EXE_PATH = (Resolve-Path 'target/debug/auv-helper.exe').Path
          "AUV_WINDOWS_HELPER_EXE_PATH=$env:AUV_WINDOWS_HELPER_EXE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cargo build --locked --package auv-cli --bin auv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --package auv-base-evals --bin win32-receiver --bin background-session-eval
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The PR's standard Check workflow owns the full workspace suite. Keep
      # native acceptance independent of that duplicate long-running build.
      - name: Run affected contract and no-desktop regression tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          cargo test --locked -p auv-api-proto -p auv-core -p auv-cli-invoke -p auv-cli --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p auv-driver-windows --lib accessibility:: -- --skip snapshot_window_captures_root_node_for_a_live_window
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p auv-base-evals --lib desktop_windows::foreground_commands::workflow::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --quiet -- invoke --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise all three original workflow routes twice
        shell: pwsh
        run: |
          & target/debug/background-session-eval.exe workflow --output "$env:RUNNER_TEMP/auv-focus-baseline" --auv target/debug/auv.exe --rounds 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise all three semantic focus routes twice
        shell: pwsh
        run: |
          & target/debug/background-session-eval.exe workflow --output "$env:RUNNER_TEMP/auv-focus-semantic" --auv target/debug/auv.exe --rounds 2 --semantic-focus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise capture guards with independently changed owned UI twice
        shell: pwsh
        run: |
          & target/debug/background-session-eval.exe workflow --output "$env:RUNNER_TEMP/auv-focus-guard" --auv target/debug/auv.exe --rounds 2 --routes runner --semantic-focus --capture-guard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify complete workflows and independent focus receipts
        shell: pwsh
        run: |
          foreach ($mode in @('baseline', 'semantic', 'guard')) {
            $records = @(Get-ChildItem -Path "$env:RUNNER_TEMP/auv-focus-$mode" -Filter workflow.jsonl -Recurse)
            $expected = if ($mode -eq 'guard') { 2 } else { 6 }
            if ($records.Count -ne $expected) { throw "$mode expected $expected records, got $($records.Count)" }
            foreach ($record in $records) {
              $rows = @(Get-Content -LiteralPath $record.FullName | ForEach-Object { $_ | ConvertFrom-Json })
              $summaries = @($rows | Where-Object { $_.kind -eq 'summary' })
              if ($summaries.Count -ne 1) { throw "Missing unique summary in $($record.FullName)" }
              $summary = $summaries[0]
              if ($summary.passed -ne $true -or $summary.user_interrupted -ne $false) { throw "Failed workflow in $($record.FullName)" }
              if ($summary.quiet_inconclusive -ne 0 -or $summary.quiet_violated -ne 0 -or $summary.input_action_retries -ne 0) { throw "Unsafe workflow in $($record.FullName)" }
              if ($mode -ne 'baseline') {
                $refusals = @($rows | Where-Object { $_.kind -eq 'missing_focus_query' })
                $focus = @($rows | Where-Object { $_.kind -eq 'semantic_focus_verification' })
                if ($refusals.Count -ne 1 -or $refusals[0].verified -ne $true -or $refusals[0].failure_code -ne 'not_found') { throw "Missing refusal proof in $($record.FullName)" }
                if ($refusals[0].input_progress -ne 'not_delivered') { throw "Missing delivery receipt in $($record.FullName)" }
                $rawProgress = if ($summary.route -eq 'rust') { $refusals[0].failure_response.input_progress } else { $refusals[0].failure_response.failure_details.input_progress }
                if ($rawProgress.state -ne 'not_delivered') { throw "Raw failure lost its zero-delivery receipt in $($record.FullName)" }
                if ($focus.Count -ne 1 -or $focus[0].verified -ne $true -or $focus[0].receiver_focused -ne $true) { throw "Missing application focus proof in $($record.FullName)" }
                $rejected = @($rows | Where-Object { $_.kind -eq 'focus_rejection_verification' })
                if ($rejected.Count -ne 1 -or $rejected[0].verified -ne $true) { throw "Missing post-delivery refusal in $($record.FullName)" }
                $proof = $rejected[0]
                if ($proof.focus_received -ne $true -or $proof.focus_rejected -ne $true -or $proof.receiver_typing_focused -ne $false -or $proof.receiver_button_focused -ne $true) { throw "Missing application-owned rejection facts in $($record.FullName)" }
                if ($proof.text_keys_clicks_unchanged -ne $true -or $proof.pointer_keys_unchanged -ne $true -or $proof.input_action_retries -ne 0) { throw "Unexpected refusal input in $($record.FullName)" }
                $rawProgress = if ($summary.route -eq 'rust') { $proof.failure_response.input_progress } else { $proof.failure_response.failure_details.input_progress }
                if ($rawProgress.state -notin @('submitted', 'delivery_uncertain') -or $rawProgress.action.verified -ne $false) { throw "Lost uncertain/submitted progress in $($record.FullName)" }
                $attempts = @($rawProgress.action.attempts)
                if ($rawProgress.action.selected_path -ne 'ax_focus' -or $attempts.Count -ne 1 -or $attempts[0].path -ne 'ax_focus' -or $attempts[0].succeeded -ne ($rawProgress.state -eq 'submitted')) { throw "Contradictory delivery attempt in $($record.FullName)" }
              }
              if ($mode -eq 'guard') {
                if ($summary.capture_guard -ne $true -or $summary.route -ne 'runner') { throw "Guard mode used the wrong route in $($record.FullName)" }
                $positive = @($rows | Where-Object { $_.kind -eq 'guarded_click_verification' })
                if ($positive.Count -ne 1 -or $positive[0].verified -ne $true) { throw "Missing unchanged-target delivery in $($record.FullName)" }
                $proof = $positive[0]
                if ($proof.application_after.clicks -ne ($proof.application_before.clicks + 1) -or $proof.response.status -ne 'completed' -or $proof.response.result.screen_point.x -ne $proof.expected_screen_point[0] -or $proof.response.result.screen_point.y -ne $proof.expected_screen_point[1]) { throw "Missing independent exact delivery facts in $($record.FullName)" }
                $refusals = @($rows | Where-Object { $_.kind -eq 'capture_guard_refusal' })
                if ($refusals.Count -ne 3 -or (@($refusals.change | Sort-Object) -join ',') -ne 'caption,minimized,moved') { throw "Missing guard faults in $($record.FullName)" }
                foreach ($proof in $refusals) {
                  if ($proof.verified -ne $true -or $proof.failure_response.failure_details.code -ne 'recapture_required' -or $proof.desktop_unchanged -ne $true -or $proof.pointer_unchanged -ne $true -or $proof.input_action_retries -ne 0) { throw "Unsafe refusal in $($record.FullName)" }
                  if ($proof.foreground[0] -ne $proof.foreground[1] -or $proof.injected_mouse[0] -ne $proof.injected_mouse[1] -or $proof.injected_keys[0] -ne $proof.injected_keys[1]) { throw "Refusal changed native input in $($record.FullName)" }
                  if ($proof.fixture_settlement.ok -ne $true -or $proof.fixture_settlement.drained_mouse_moves -lt 0 -or $proof.fixture_settlement.drained_mouse_moves -ge 64) { throw "Missing bounded fixture settlement in $($record.FullName)" }
                  if ($proof.readonly_target_query.status -ne 'completed') { throw "Missing read-only target control in $($record.FullName)" }
                  if (($proof.application_before | ConvertTo-Json -Depth 20 -Compress) -ne ($proof.application_after | ConvertTo-Json -Depth 20 -Compress)) { throw "Refusal changed application state in $($record.FullName)" }
                }
                $resets = @($rows | Where-Object { $_.kind -eq 'capture_guard_fixture_reset' })
                if ($resets.Count -ne 3 -or @($resets | Where-Object { $_.verified -ne $true }).Count -ne 0) { throw "Missing fixture resets in $($record.FullName)" }
              }
              $summary | ConvertTo-Json -Depth 5 -Compress
            }
          }

      - name: Print available outcomes
        if: always()
        shell: pwsh
        run: |
          foreach ($mode in @('baseline', 'semantic', 'guard')) {
            $directory = "$env:RUNNER_TEMP/auv-focus-$mode"
            if (Test-Path -LiteralPath $directory) {
              Get-ChildItem -LiteralPath $directory -Filter workflow.jsonl -Recurse | Sort-Object FullName | ForEach-Object {
                Write-Host $_.FullName
                Get-Content -LiteralPath $_.FullName -Tail 3
              }
            }
          }

      - name: Preserve source, preflight, and application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture-guard-58938f51
          path: |
            ${{ runner.temp }}/auv-focus-preflight/
            ${{ runner.temp }}/auv-focus-baseline/
            ${{ runner.temp }}/auv-focus-semantic/
            ${{ runner.temp }}/auv-focus-guard/
          if-no-files-found: warn
          retention-days: 14
