name: Update Scoop

on:
  release:
    types: [released]
  repository_dispatch:
    types: [update-scoop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    name: Dispatch update from main
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Scoop update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=update-scoop

  update:
    name: Update Scoop manifest
    if: github.event_name == 'repository_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Update Scoop manifest
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
          THROW_ERROR: 1
