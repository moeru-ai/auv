name: Update Homebrew

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag_name:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update Homebrew tap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Require the Homebrew tap token
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_GITHUB_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN must have Contents write access to moeru-ai/homebrew-tap." >&2
            exit 1
          fi

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          mkdir artifacts
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'auv-aarch64-apple-darwin.tar.gz.sha256' \
            --pattern 'auv-x86_64-apple-darwin.tar.gz.sha256' \
            --dir artifacts

      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone https://github.com/moeru-ai/homebrew-tap.git homebrew-tap
          scripts/render-homebrew-formula \
            "$RELEASE_TAG" \
            artifacts/auv-aarch64-apple-darwin.tar.gz.sha256 \
            artifacts/auv-x86_64-apple-darwin.tar.gz.sha256 \
            homebrew-tap/Formula/auv.rb
          git -C homebrew-tap config user.name "auv release bot"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/auv.rb
          if git -C homebrew-tap diff --cached --quiet; then
            exit 0
          fi
          git -C homebrew-tap commit -m "Update auv to ${RELEASE_TAG}"
          git -C homebrew-tap push origin HEAD
