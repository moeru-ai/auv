name: Windows mouse recipient evidence

on:
  push:
    branches:
      - codex/windows-mouse-evidence

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  mouse-recipient:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c87ffa53a3b1f38095541b213ff026432652b069
          fetch-depth: 2
          persist-credentials: false

      - name: Record exact source and isolated desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($actual -ne 'c87ffa53a3b1f38095541b213ff026432652b069') { throw "Unexpected source $actual" }
          $directory = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/auv-mouse-evidence" -Force
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class MouseDesktopProbe {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
              [DllImport("user32.dll")]
              public static extern bool CloseDesktop(IntPtr desktop);
              [DllImport("user32.dll")]
              static extern IntPtr SetThreadDpiAwarenessContext(IntPtr context);
              [DllImport("user32.dll")]
              static extern bool AreDpiAwarenessContextsEqual(IntPtr left, IntPtr right);
              [DllImport("user32.dll")]
              static extern IntPtr GetThreadDpiAwarenessContext();
              [DllImport("user32.dll")]
              static extern IntPtr GetWindowDpiAwarenessContext(IntPtr window);
              [DllImport("user32.dll")]
              static extern uint GetDpiForWindow(IntPtr window);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              static extern IntPtr CreateWindowExW(uint extra, string kind, string title, uint style,
                  int x, int y, int width, int height, IntPtr parent, IntPtr menu, IntPtr instance, IntPtr data);
              [DllImport("user32.dll")]
              static extern bool DestroyWindow(IntPtr window);
              public static uint ReadDpi() {
                  var requested = new IntPtr(-4);
                  var previous = SetThreadDpiAwarenessContext(requested);
                  if (previous == IntPtr.Zero) throw new InvalidOperationException("DPI context failed");
                  var window = IntPtr.Zero;
                  try {
                      window = CreateWindowExW(0x08000080, "STATIC", "AUV foreground DPI preflight", 0,
                          0, 0, 1, 1, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero);
                      if (window == IntPtr.Zero || !AreDpiAwarenessContextsEqual(GetWindowDpiAwarenessContext(window), requested))
                          throw new InvalidOperationException("DPI window creation failed");
                      var dpi = GetDpiForWindow(window);
                      if (dpi == 0) throw new InvalidOperationException("DPI query failed");
                      return dpi;
                  } finally {
                      var destroyed = window == IntPtr.Zero || DestroyWindow(window);
                      var restored = SetThreadDpiAwarenessContext(previous) != IntPtr.Zero
                          && AreDpiAwarenessContextsEqual(GetThreadDpiAwarenessContext(), previous);
                      if (!destroyed || !restored) throw new InvalidOperationException("DPI probe cleanup failed");
                  }
              }
          }
          '@
          $desktop = [MouseDesktopProbe]::OpenInputDesktop(0, $false, 1)
          $accessible = $desktop -ne [IntPtr]::Zero
          if ($accessible -and -not [MouseDesktopProbe]::CloseDesktop($desktop)) { throw 'Desktop handle did not close' }
          $screens = @([System.Windows.Forms.Screen]::AllScreens)
          if (-not [Environment]::UserInteractive -or -not $accessible -or $screens.Count -ne 1) {
            throw 'Stop before native tests: one accessible isolated interactive display is required'
          }
          [ordered]@{
            source_sha = $actual
            base_sha = '1f112bf145ddb23583b7aac83d0fa8e8cf1d29af'
            workflow_sha = '${{ github.sha }}'
            os = [Environment]::OSVersion.VersionString
            image_version = $env:ImageVersion
            session_id = (Get-Process -Id $PID).SessionId
            user_interactive = [Environment]::UserInteractive
            input_desktop_accessible = $accessible
            screens = @($screens | ForEach-Object { $_.Bounds.ToString() })
            primary_window_dpi = [MouseDesktopProbe]::ReadDpi()
            expected_baseline_failure = $false
          } | ConvertTo-Json -Depth 4 | Tee-Object -FilePath "$directory/preflight.json"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build fixed Driver and complete drag regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-mouse-evidence"
          rustc --version | Tee-Object -FilePath "$directory/rustc.txt"
          cargo build --locked -p auv-base-evals --bin background-session-eval --bin win32-receiver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @('target/debug/background-session-eval.exe','target/debug/win32-receiver.exe') | ForEach-Object {
            $item = Get-Item -LiteralPath $_
            @{ path=$item.FullName; sha256=(Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          } | ConvertTo-Json | Set-Content -LiteralPath "$directory/binaries.json"

      - name: Recheck recipient watcher lifetime models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-mouse-evidence"
          cargo test --locked -p auv-driver-windows --lib input::recipient::native::tests > "$directory/watcher.stdout.log" 2> "$directory/watcher.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/watcher.stdout.log" -SimpleMatch 'test result: ok. 5 passed; 0 failed')) { throw 'Expected five watcher lifecycle models' }
          cargo test --locked -p auv-driver-windows --lib input::native::click_tests > "$directory/partial-click.stdout.log" 2> "$directory/partial-click.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/partial-click.stdout.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed')) { throw 'Expected owned partial-click cleanup model' }
          cargo test --locked -p auv-driver-windows --lib session::tests::pre_cancelled_foreground_window_click_reports_not_delivered > "$directory/pre-cancel.stdout.log" 2> "$directory/pre-cancel.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/pre-cancel.stdout.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed')) { throw 'Expected pre-cancel receipt regression' }
          cargo test --locked -p auv-driver-windows --lib session::tests::pre_cancelled_foreground_window_scroll_reports_not_delivered > "$directory/scroll-pre-cancel.stdout.log" 2> "$directory/scroll-pre-cancel.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/scroll-pre-cancel.stdout.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed')) { throw 'Expected scroll pre-cancel receipt regression' }
          cargo test --locked -p auv-driver-common --lib scroll_ > "$directory/scroll-common.stdout.log" 2> "$directory/scroll-common.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/scroll-common.stdout.log" -SimpleMatch 'test result: ok. 24 passed; 0 failed')) { throw 'Expected twenty-four common scroll regressions' }
          cargo test --locked -p auv-driver-windows --lib pre_cancelled_window_scroll_ > "$directory/batch-pre-cancel.stdout.log" 2> "$directory/batch-pre-cancel.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/batch-pre-cancel.stdout.log" -SimpleMatch 'test result: ok. 2 passed; 0 failed')) { throw 'Expected two batch pre-cancel regressions' }

      - name: Verify complete motion lifecycle and owned release models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-mouse-evidence"
          cargo test --locked -p auv-driver-common --lib mouse_input::tests > "$directory/drag-common.stdout.log" 2> "$directory/drag-common.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/drag-common.stdout.log" -SimpleMatch 'test result: ok. 19 passed; 0 failed')) { throw 'Expected nineteen mouse lifecycle models' }
          cargo test --locked -p auv-driver-windows --lib input::native::button_tests > "$directory/owned-button.stdout.log" 2> "$directory/owned-button.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/owned-button.stdout.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed')) { throw 'Expected owned button-up model' }
          cargo test --locked -p auv-driver-windows --lib session::tests::pre_cancelled_foreground_window_drag_reports_not_delivered > "$directory/drag-pre-cancel.stdout.log" 2> "$directory/drag-pre-cancel.stderr.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$directory/drag-pre-cancel.stdout.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed')) { throw 'Expected drag pre-cancel receipt' }

      - name: Recheck the existing keyboard fault receiver after shared fixture extraction
        shell: pwsh
        env:
          AUV_ISOLATED_DESKTOP_EVAL: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-mouse-evidence"
          & 'target/debug/background-session-eval.exe' window-keyboard --output "$directory/keyboard" > "$directory/keyboard.stdout.log" 2> "$directory/keyboard.stderr.log"
          $exit = $LASTEXITCODE
          $rows = @(Get-Content -LiteralPath "$directory/keyboard/window-keyboard.jsonl" | ForEach-Object { $_ | ConvertFrom-Json -Depth 60 })
          $cases = @($rows | Where-Object kind -eq 'case')
          if ($exit -ne 0 -or $cases.Count -ne 15 -or @($cases | Where-Object { -not $_.passed }).Count -ne 0) { throw 'Existing keyboard fixture regression failed' }
          $cleanup = @($rows | Where-Object kind -eq 'cleanup')
          if ($cleanup.Count -ne 30 -or @($cleanup | Where-Object { -not $_.process_exited -or -not $_.window_destroyed }).Count -ne 0) { throw 'Keyboard receiver cleanup incomplete' }

      - name: Verify foreground scroll and close lifetime failures
        shell: pwsh
        env:
          AUV_ISOLATED_DESKTOP_EVAL: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-mouse-evidence"
          & 'target/debug/background-session-eval.exe' window-mouse --output "$directory/mouse" > "$directory/mouse.stdout.log" 2> "$directory/mouse.stderr.log"
          $exit = $LASTEXITCODE
          $rows = @(Get-Content -LiteralPath "$directory/mouse/window-mouse.jsonl" | ForEach-Object { $_ | ConvertFrom-Json -Depth 60 })
          $cases = @($rows | Where-Object kind -eq 'case')
          $cases | Select-Object case,operation,passed,target_lost,cancelled,cancellation_receipt,@{n='a_clicks';e={$_.after_a.clicks}},@{n='b_clicks';e={$_.after_b.clicks}},@{n='a_line';e={$_.after_a.first_line}},@{n='b_line';e={$_.after_b.first_line}},input_progress | ConvertTo-Json -Depth 12 | Tee-Object -FilePath "$directory/mouse-result.json"
          $cleanup = @($rows | Where-Object kind -eq 'cleanup')
          if ($cleanup.Count -ne 44 -or @($cleanup | Where-Object { -not $_.process_exited -or -not $_.window_destroyed }).Count -ne 0) { throw 'Owned mouse receiver cleanup incomplete' }
          if ($exit -ne 0 -or $cases.Count -ne 22 -or @($cases | Where-Object { -not $_.passed }).Count -ne 0) { throw 'Mouse recipient invariant failed; inspect retained native application counters' }

      - name: Verify recipient lifetime across timed and live scroll samples
        shell: pwsh
        env:
          AUV_ISOLATED_DESKTOP_EVAL: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-mouse-evidence"
          & 'target/debug/background-session-eval.exe' window-scroll-batch --output "$directory/batch" > "$directory/batch.stdout.log" 2> "$directory/batch.stderr.log"
          $exit = $LASTEXITCODE
          $rows = @(Get-Content -LiteralPath "$directory/batch/window-scroll-batch.jsonl" | ForEach-Object { $_ | ConvertFrom-Json -Depth 60 })
          $cases = @($rows | Where-Object kind -eq 'case')
          $cases | Select-Object case,passed,native_ok,target_lost,@{n='a_wheels';e={$_.after_a.raw.edit_wheel}},@{n='b_wheels';e={$_.after_b.raw.edit_wheel}},@{n='a_line';e={$_.after_a.first_line}},input_progress | ConvertTo-Json -Depth 12 | Tee-Object -FilePath "$directory/batch-result.json"
          $cleanup = @($rows | Where-Object kind -eq 'cleanup')
          if ($cleanup.Count -ne 54 -or @($cleanup | Where-Object { -not $_.process_exited -or -not $_.window_destroyed }).Count -ne 0) { throw 'Owned batch receiver cleanup incomplete' }
          if ($exit -ne 0 -or $cases.Count -ne 27 -or @($cases | Where-Object { -not $_.passed }).Count -ne 0) { throw 'Whole scroll recipient invariant failed; inspect application prefix receipts' }

      - name: Verify complete drag interruption and owned release
        shell: pwsh
        env:
          AUV_ISOLATED_DESKTOP_EVAL: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/auv-mouse-evidence"
          & 'target/debug/background-session-eval.exe' window-drag --output "$directory/drag" > "$directory/drag.stdout.log" 2> "$directory/drag.stderr.log"
          $exit = $LASTEXITCODE
          $rows = @(Get-Content -LiteralPath "$directory/drag/window-drag.jsonl" | ForEach-Object { $_ | ConvertFrom-Json -Depth 60 })
          $cases = @($rows | Where-Object kind -eq 'case')
          $cases | Select-Object case,passed,native_ok,target_lost,cancelled,button_released_before_controller_cleanup,cursor_after,input_progress,error | ConvertTo-Json -Depth 15 | Tee-Object -FilePath "$directory/drag-result.json"
          $cleanup = @($rows | Where-Object kind -eq 'cleanup')
          if ($cleanup.Count -ne 26 -or @($cleanup | Where-Object { -not $_.process_exited -or -not $_.window_destroyed }).Count -ne 0) { throw 'Owned drag receiver cleanup incomplete' }
          if ($exit -ne 0 -or $cases.Count -ne 13 -or @($cases | Where-Object { -not $_.passed }).Count -ne 0) { throw 'Complete drag recipient invariant failed; inspect retained application and release receipts' }

      - name: Preserve source-bound native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-drag-c87ffa53-fixed
          path: ${{ runner.temp }}/auv-mouse-evidence/
          if-no-files-found: warn
          retention-days: 14
